<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Rivers</title>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&display=swap" rel="stylesheet">
<style>

  #countdown { top: 32%; font-size: 120px; font-weight: 800; text-shadow: 0 6px 0 #1A1D23; }
  #hint { bottom: 20px; left: 50%; right: auto; transform: translateX(-50%); max-width: 92vw; padding: 2px 12px; border-radius: 8px; background: rgba(18, 20, 25, .6); font-size: 19px; font-weight: 800; }
  #hint:empty { display: none; }
  #progress { top: 66px; left: 50%; right: auto; transform: translateX(-50%); width: max-content; max-width: 94vw; box-sizing: border-box; padding: 2px 12px; border-radius: 8px; background: rgba(18, 20, 25, .6); font-size: 16px; font-weight: 800; }
  #meter { top: 96px; left: 50%; right: auto; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 2px 12px; border-radius: 8px; background: rgba(18, 20, 25, .6); font-size: 13px; font-weight: 800; }
  #track { width: min(60vw, 320px); height: 16px; border-radius: 8px; background: #1A1D23; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #FF5A4F; }
  #powers { bottom: 62px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 0 12px; }
  #powers button { pointer-events: auto; height: 52px; padding: 0 20px; border: 0; border-radius: 12px; background: #F3F5F7; color: #23272F; font: 800 16px Overpass, system-ui, sans-serif; cursor: pointer; }
  #powers button:disabled { background: #3B4250; color: #A9B2BF; cursor: default; }
  @media (max-width: 480px) {
    #powers { bottom: 72px; gap: 6px; padding: 0 6px; flex-wrap: nowrap; }
    #powers button { flex: 1 1 0; min-width: 0; height: 56px; padding: 0 4px; font-size: 13px; }
  }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .gain { position: fixed; font-size: 56px; font-weight: 800; color: #FFD84A; text-shadow: 0 4px 0 #1A1D23; pointer-events: none; transform: translate(-50%, -50%); animation: gain .9s ease-out forwards; }
  @keyframes gain { to { opacity: 0; margin-top: -120px; } }
  .overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; text-align: center; background: rgba(18, 20, 25, .88); }
  .overlay h1 { margin: 0; font-size: 42px; font-weight: 800; }
  .overlay p { margin: 0; max-width: 460px; font-size: 18px; line-height: 1.4; color: #D5DBE3; }
  .overlay button { height: 52px; padding: 0 28px; border: 0; border-radius: 12px; background: #F3F5F7; color: #23272F; font: 800 17px Overpass, system-ui, sans-serif; cursor: pointer; }
  .overlay button:disabled { background: #3B4250; color: #A9B2BF; cursor: default; }
  #shop { display: none; flex-direction: column; align-items: center; gap: 10px; }
  #extras { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  #worldTabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 620px; }
  #levels #worldTabs button { height: 34px; padding: 0 10px; background: #3B4250; color: #F3F5F7; font-size: 12px; }
  #levels #worldTabs button.current { background: #FFD84A; color: #23272F; }
  #levelList { display: grid; grid-template-columns: repeat(2, auto); gap: 10px; }
  #levelList button { min-width: 150px; height: 44px; padding: 0 10px; font-size: 14px; }
  .corner { position: fixed; top: 14px; height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: #3B4250; color: #F3F5F7; font: 600 13px Overpass, system-ui, sans-serif; cursor: pointer; }
  #cardList { display: flex; flex-direction: column; gap: 12px; max-width: 480px; }
  #cardList div { padding: 12px 16px; border-radius: 12px; background: #2E343E; text-align: left; font-size: 16px; line-height: 1.35; color: #D5DBE3; }
  #cardList b { display: block; margin-bottom: 2px; font-size: 18px; color: #FFD84A; }
</style>
</head>
<body>
<div id="coins" class="hud">0</div>
<div id="countdown" class="hud"></div>
<div id="progress" class="hud"></div>
<div id="meter" class="hud"><span>MESS</span><div id="track"><div id="fill"></div></div></div>
<div id="hint" class="hud"></div>
<div id="powers" class="hud"><button id="flush"></button><button id="slow"></button><button id="swap"></button><button id="boost"></button><button id="hold"></button><button id="flood"></button><button id="lock"></button></div>
<div id="flash"></div>
<button id="newGame" class="corner" style="left:12px">New game</button>
<button id="levelsButton" class="corner" style="left:104px">Levels</button>
<div id="end" class="overlay">
  <h1 id="headline"></h1>
  <p id="summary"></p>
  <div id="shop">
    <button id="build"></button>
    <div id="extras"><button id="buyFlush"></button><button id="buySlow"></button></div>
  </div>
  <button id="next"></button>
  <button id="endLevels">Choose a level</button>
</div>
<div id="levels" class="overlay">
  <h1>Choose a level</h1>
  <div id="worldTabs"></div>
  <div id="levelList"></div>
  <button id="closeLevels">Back</button>
</div>
<div id="card" class="overlay">
  <h1 id="cardTitle"></h1>
  <div id="cardList"></div>
  <button id="cardOk">Got it</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const MAX_PEOPLE = 6000, MAX_STOPS = 5, LEVEL_COUNT = 100;
const R = 2.6, ROAD_LENGTH = 24, GATE = ROAD_LENGTH - R - 0.1, EXIT_LENGTH = 3;
const N = 0, E = 1, S = 2, W = 3;
const PORT = [[0, -1], [1, 0], [0, 1], [-1, 0]];
// Test switch: set to false to bring back building and level locks.
const OPEN_ALL_LEVELS = true;

const bridgeLayout = {
  name: 'Bridge',
  discs: [[-3, 0], [5.4, 0]],
  sources: [{ disc: 0, port: N, colour: 0 }, { disc: 0, port: S, colour: 1 }, { disc: 1, port: E, colour: 2 }],
  stops: [{ disc: 0, port: W }, { disc: 1, port: N }, { disc: 1, port: S }],
  links: [{ a: 0, aPort: E, b: 1, bPort: W }],
  landmarks: { school: [-0.7, -6.5], offices: [-0.7, 6.5], stadium: [-10, -6.4] },
  look: [-1.5, 0],
  view: [23, 22]
};

function rotateLayout(layout, name) {
  const spin = ([x, z]) => [-z, x];
  return {
    name,
    discs: layout.discs.map(spin),
    sources: layout.sources.map((s) => ({ ...s, port: (s.port + 1) % 4 })),
    stops: layout.stops.map((s) => ({ ...s, port: (s.port + 1) % 4 })),
    links: layout.links.map((l) => ({ ...l, aPort: (l.aPort + 1) % 4, bPort: (l.bPort + 1) % 4 })),
    landmarks: Object.fromEntries(Object.entries(layout.landmarks).map(([id, spot]) => [id, spin(spot)])),
    look: spin(layout.look),
    view: [layout.view[1] + 1, layout.view[0] + 4]
  };
}

const branchesLayout = {
  name: 'Branches',
  discs: [[-7, 0], [2, 0], [2, -8.4], [2, 8.4]],
  sources: [{ disc: 0, port: N, colour: 0 }, { disc: 0, port: S, colour: 1 }, { disc: 1, port: E, colour: 2 }],
  stops: [{ disc: 0, port: W }, { disc: 2, port: W }, { disc: 2, port: E }, { disc: 3, port: W }, { disc: 3, port: E }],
  links: [{ a: 0, aPort: E, b: 1, bPort: W }, { a: 1, aPort: N, b: 2, bPort: S }, { a: 1, aPort: S, b: 3, bPort: N }],
  landmarks: { school: [7, -4.5], offices: [7, 4.5], stadium: [-13, -7] },
  look: [-2.5, 0],
  view: [31, 31]
};

const LAYOUTS = { bridge: bridgeLayout, tower: rotateLayout(bridgeLayout, 'Tower'), branches: branchesLayout, branchesTall: rotateLayout(branchesLayout, 'Branches') };
LAYOUTS.tower.view = [20, 27];
LAYOUTS.branchesTall.view = [26, 32];
const PORTRAIT = innerHeight > innerWidth;
const PORTRAIT_LAYOUTS = { bridge: 'tower', branches: 'branchesTall' };
const layoutFor = (key) => LAYOUTS[PORTRAIT ? PORTRAIT_LAYOUTS[key] || key : key];

const otherEnd = (local) => (local < 2 ? 1 - local : 5 - local);

function prepareLayout(layout) {
  layout.stopSpots = layout.stops.map((s) => {
    const [dx, dz] = PORT[s.port], [x, z] = layout.discs[s.disc];
    return { x: x + dx * R, z: z + dz * R, dx, dz };
  });
  layout.linkPaths = layout.links.map((l) => {
    const [dx, dz] = PORT[l.aPort], [ax, az] = layout.discs[l.a], [bx, bz] = layout.discs[l.b];
    return { ...l, dx, dz, x: ax + dx * R, z: az + dz * R, length: Math.abs(bx - ax) + Math.abs(bz - az) - 2 * R };
  });
  layout.ports = layout.discs.map(() => [null, null, null, null]);
  layout.stops.forEach((s, stop) => { layout.ports[s.disc][s.port] = { stop }; });
  layout.links.forEach((l, link) => {
    layout.ports[l.a][l.aPort] = { link, forward: true };
    layout.ports[l.b][l.bPort] = { link, forward: false };
  });

  layout.reachable = layout.stops.map(() => new Set());
  for (let n = 0; n < 1 << layout.discs.length; n++) {
    const ks = layout.discs.map((_, d) => (n >> d) & 1);
    layout.sources.forEach((source) => {
      const stop = routeOf(layout, source, ks);
      if (stop !== null) layout.reachable[stop].add(source.colour);
    });
  }
}

function routeOf(layout, source, ks) {
  let disc = source.disc, port = source.port;
  for (let guard = 0; guard < 10; guard++) {
    const local = ((port - ks[disc]) % 4 + 4) % 4;
    const out = otherEnd(local);
    const target = layout.ports[disc][(out + ks[disc]) % 4];
    if (!target) return null;
    if (target.stop !== undefined) return target.stop;
    const link = layout.links[target.link];
    disc = target.forward ? link.b : link.a;
    port = target.forward ? link.bPort : link.aPort;
  }
  return null;
}

Object.values(LAYOUTS).forEach(prepareLayout);

const WORLDS = [
  { name: 'First Streets', layout: 'bridge', features: [['ambulance', 6]],
    theme: { ground: 0x9CCB6B, road: 0x454A53, blocks: [0xF2D6A2, 0xE8B08C, 0xD9C5A0], plate: 0xB7BEC9, tree: 0x4E9A4A, trees: 0.9, sky: 0.65, sun: 0.6, sunColour: 0xFFF1D0, tall: 0.5 } },
  { name: 'Green City', layout: 'bridge', features: [['three', 0]],
    theme: { ground: 0x6FBF73, road: 0x3A4048, blocks: [0xC9E7C2, 0x9AD3A0, 0xE4F2D8], plate: 0xA8D8B0, tree: 0x2F8F4E, trees: 1, sky: 0.65, sun: 0.6, sunColour: 0xF2FFD8, tall: 0.7, particle: { colours: [0x7CCB5B, 0xB8DB5A], speed: 2.2, size: 0.12 } } },
  { name: 'Two-Tone Town', layout: 'tower', features: [['mixed', 0]],
    theme: { ground: 0xE9DCC9, road: 0x5A5560, blocks: [0xF29CB7, 0x8ED0E8, 0xF7D57E], plate: 0xFFFFFF, tree: 0xE27FA8, trees: 0.45, sky: 0.65, sun: 0.6, sunColour: 0xFFF4F0, tall: 0.8 } },
  { name: 'Rail Yard', layout: 'tower', features: [['train', 0]],
    theme: { ground: 0x8B7355, road: 0x3B342C, blocks: [0x7C5C48, 0x9C7A58, 0x5E4A3C], plate: 0xB08A5E, tree: 0x6A6A3A, trees: 0.15, sky: 0.8, sun: 0.85, sunColour: 0xFFD09A, tall: 1, particle: { colours: [0xC8A878, 0xA88860], speed: 1.2, size: 0.09 } } },
  { name: 'Night Shift', layout: 'branches', features: [['night', 0], ['ambulance', 4]],
    theme: { ground: 0x14172A, road: 0x0D0F18, blocks: [0x2B2F55, 0x3D2F6E, 0x2A4A6E], plate: 0x4A5580, tree: 0x1E3A4E, trees: 0.2, sky: 0.8, sun: 0.75, sunColour: 0xB8C8FF, tall: 1.05 } },
  { name: 'Roadworks', layout: 'branches', features: [['roadworks', 0], ['rogue', 5]],
    theme: { ground: 0xC9A24A, road: 0x4A4438, blocks: [0xE0C070, 0x8D8A80, 0xB8B0A0], plate: 0xF0B429, tree: 0x8A7A30, trees: 0.1, sky: 0.55, sun: 0.55, sunColour: 0xFFE8B0, tall: 1.1, particle: { colours: [0xD8C080], speed: 1, size: 0.08 } } },
  { name: 'Rush Hour', layout: 'rotate', features: [['ambulance', 0]], rush: true,
    theme: { ground: 0x5B3A53, road: 0x2A2030, blocks: [0xE08A5C, 0xC9586C, 0x6B4B8A], plate: 0xFF9A5A, tree: 0x8A3A5A, trees: 0.08, sky: 0.7, sun: 0.95, sunColour: 0xFF9A5A, tall: 1.3 } },
  { name: 'Double Trouble', layout: 'rotate', mixes: [['three', 'train'], ['mixed', 'night'], ['train', 'night'], ['three', 'rogue'], ['mixed', 'train'], ['night', 'rogue'], ['three', 'night'], ['mixed', 'rogue'], ['train', 'rogue'], ['three', 'mixed']],
    theme: { ground: 0x2E3C6E, road: 0x171E3A, blocks: [0x6C4FD8, 0x2FB8A8, 0x453A9E], plate: 0x5FE0D0, tree: 0x2F6A9A, trees: 0.08, sky: 0.8, sun: 0.8, sunColour: 0xC8D0FF, tall: 1.45 } },
  { name: 'Chaos', layout: 'rotate', mixes: [['three', 'train', 'night'], ['mixed', 'night', 'rogue'], ['three', 'mixed', 'train'], ['train', 'night', 'rogue'], ['three', 'night', 'rogue'], ['mixed', 'train', 'rogue'], ['three', 'mixed', 'night'], ['three', 'train', 'rogue'], ['mixed', 'train', 'night'], ['three', 'mixed', 'rogue']],
    theme: { ground: 0x3A1F22, road: 0x1A0F11, blocks: [0x6E2A2A, 0x3E2A2A, 0x8C3A2A], plate: 0xB04A3A, tree: 0x4A2020, trees: 0.05, sky: 0.55, sun: 0.75, sunColour: 0xFF6A50, tall: 1.6, particle: { colours: [0x9FC8FF, 0xC8DCFF], speed: 26, size: 0.07, tall: true } } },
  { name: 'Grand Festival', layout: 'branches', features: [['three', 0], ['mixed', 0], ['train', 0], ['roadworks', 0]], festival: true,
    theme: { ground: 0x2A1C4E, road: 0x140E28, blocks: [0xFF5BA0, 0xFFD84A, 0x47D1E0], plate: 0xFFD84A, tree: 0xFF5BA0, trees: 0.1, sky: 0.9, sun: 0.85, sunColour: 0xFFE0F0, tall: 1.7, particle: { colours: [0xFF5BA0, 0xFFD84A, 0x47D1E0, 0x8CE36A], speed: 4, size: 0.14 } } }
];

const FEATURE_POWERS = { train: 'hold', rogue: 'lock', night: 'flood', mixed: 'boost', three: 'swap' };
const STEP_MODES = ['fill', 'fill', 'fill', 'fill', 'strikes', 'clock', 'fill', 'strikes', 'clock', 'boss'];
const FIRST_CLOCK_LEVEL = 17;

const CARDS = {
  basics: ['How to play', 'Tap a turntable to switch where the rivers go. Send each colour to the bus of the same colour.'],
  twoDiscs: ['A second turntable', 'The right turntable chooses which stop the crossing river reaches. Tap it to switch.'],
  mess: ['Watch the Mess meter', 'Wrong colours pile up at the stop. Fill that stop\'s bus to clear its pile.'],
  flush: ['Power: Flush', 'Tap Flush to clear all the mess at once. You only get a couple each level.'],
  ambulance: ['Ambulances', 'A road flashes red, then an ambulance blocks it. Send your river somewhere else.'],
  slow: ['Power: Slow', 'Slows the rivers for a few seconds so you can think.'],
  strikes: ['Strikes', 'Getting hit by a hazard is a strike. Three strikes and you lose the level.'],
  boss: ['Boss level', 'The last of the crowd goes on one giant bus. Point every river at it.'],
  three: ['Green river', 'A third river joins. It can reach every stop except the far one.'],
  swap: ['Power: Swap', 'Swaps the colours of the buses waiting at your stops.'],
  clock: ['Beat the clock', 'Get the whole crowd on board before the timer runs out.'],
  tower: ['New road: the Tower', 'The roads have changed shape. Same rules.'],
  mixed: ['Two-tone buses', 'They need both blue and orange, so switch rivers halfway through.'],
  boost: ['Power: Rush', 'Everyone runs faster for a few seconds.'],
  train: ['Trains', 'The bell warns you. Anyone on the bridge when the train passes goes flying.'],
  hold: ['Power: Hold bridge', 'Stops the river before the bridge so nobody is on it when the train comes.'],
  branches: ['New road: Branches', 'Four turntables. Rivers now split twice, so plan two turns ahead.'],
  night: ['Night', 'You can only see the buses in the flashes. The rivers glow.'],
  flood: ['Power: Floodlight', 'Lights up the whole city for a few seconds.'],
  roadworks: ['Roadworks', 'A turntable glows yellow, then locks. Set your route first: locked turntables pay double.'],
  rogue: ['Rogue turntables', 'Purple means a turntable is about to flip itself.'],
  lock: ['Power: Lock', 'Stops turntables flipping or locking for a few seconds.']
};

const POWER_TIME = { slow: 4, boost: 5, hold: 3, flood: 5, lock: 6 };
const POWER_LABELS = { flush: 'Flush mess', slow: 'Slow rivers', swap: 'Swap stops', boost: 'Rush boarding', hold: 'Hold bridge', flood: 'Floodlight', lock: 'Lock turntables' };

function makeLevels() {
  const seen = new Set();
  return Array.from({ length: LEVEL_COUNT }, (_, index) => {
    const w = Math.floor(index / 10), step = index % 10, world = WORLDS[w], boss = step === 9;
    const progress = index / (LEVEL_COUNT - 1);
    const features = world.mixes ? world.mixes[step] : world.features.filter(([, from]) => step >= from).map(([name]) => name);
    const has = (feature) => features.includes(feature);
    const layoutKey = world.layout === 'rotate' ? ['bridge', 'tower', 'branches'][step % 3] : world.layout;
    const three = has('three');

    const featurePowers = features.map((f) => FEATURE_POWERS[f]).filter(Boolean);
    const powers = [...new Set([...(index >= 4 ? ['flush'] : []), ...featurePowers, ...(index >= 7 ? ['slow'] : [])])].slice(0, 3);

    const level = {
      world: w,
      layoutKey,
      singleDisc: index < 2,
      speed: 0.72 + 0.62 * progress,
      goal: 6 + Math.round(14 * progress) + Math.round(step * 0.3),
      rate: (30 + 20 * progress) * (world.festival ? 2 : 1),
      colours: three ? 3 : 2,
      mixed: has('mixed'),
      mixedChance: w === 2 ? 0.4 : 0.3,
      ambulance: has('ambulance'),
      roadworks: has('roadworks'),
      train: has('train'),
      night: has('night'),
      rogue: has('rogue'),
      boss,
      bossSize: world.festival ? 3 : 2,
      calm: step < 7,
      powers
    };

    level.seats = Math.round((135 - 25 * progress) * (world.festival ? 2 : 1) / 2) * 2;
    level.maxMess = Math.round(level.goal * level.seats * (0.8 - 0.62 * Math.min(1, progress * 1.25)));
    const hasStrikes = level.ambulance || level.train;
    let mode = boss ? 'boss' : world.rush ? 'clock' : STEP_MODES[step];
    if (mode === 'clock' && index < FIRST_CLOCK_LEVEL) mode = 'fill';
    if (mode === 'strikes' && !hasStrikes) mode = 'fill';

    let goalText = 'Get the whole crowd on board.';
    if (mode === 'boss') goalText = 'Boss level: the last of the crowd takes the giant bus!';
    if (mode === 'strikes') {
      level.maxStrikes = 3;
      goalText = 'Three strikes and you lose.';
    }
    if (mode === 'clock') {
      level.timeLimit = Math.round((level.goal * level.seats / level.colours / level.rate) * 1.9 + 12);
      goalText = `Clear the crowd in ${level.timeLimit} seconds.`;
    }
    level.intro = index === 0 ? 'Tap the turntable when a bus wants the other colour' : goalText;

    const fresh = [];
    const learn = (key) => { if (!seen.has(key)) { seen.add(key); fresh.push(key); } };
    if (index === 0) learn('basics');
    if (index === 2) learn('twoDiscs');
    if (index === 3) learn('mess');
    if (layoutKey !== 'bridge') learn(layoutKey);
    features.forEach(learn);
    powers.forEach(learn);
    if (mode !== 'fill') learn(mode);
    level.cards = fresh.map((key) => CARDS[key]).filter(Boolean);
    level.worldStart = step === 0;
    return level;
  });
}

const LEVELS = makeLevels();
const BUILDINGS = [
  { id: 'school', name: 'School', price: 20000, afterLevel: 9, pitch: 'Pays 25% more, but the bell makes the blue river surge.' },
  { id: 'offices', name: 'Offices', price: 60000, afterLevel: 19, pitch: 'Pays 50% more, but a morning rush makes the orange river surge.' },
  { id: 'stadium', name: 'Stadium', price: 120000, afterLevel: 29, pitch: 'Doubles your coins, but full time makes both rivers surge.' }
];
const SURGE_SPEED = 1.7, SCHOOL_GAP = 15, SCHOOL_SURGE = 3, OFFICE_SURGE = 8, STADIUM_SURGE = 5, EXTRA_PRICE = 1000, MAX_EXTRA = 3, SAVE_KEY = 'rivers-save';
const AMBULANCE_WARNING = 1.5, AMBULANCE_STAY = 2.5, AMBULANCE_GAP = 6;
const AMBULANCE_STRIKE_HITS = 40, TRAIN_STRIKE_HITS = 25;
const LOCK_WARNING = 2, LOCK_TIME = 3, LOCK_GAP = 8;
const PLATE_WARN = 0xFFD84A, PLATE_LOCKED = 0xFF5A4F, PLATE_ROGUE = 0xA05CFF, PLATE_ASLEEP = 0x70757D;
const SLOW_FACTOR = 0.45, POWER_CHARGES = 2;
const TRAIN_WARNING = 2, TRAIN_GAP = 9, TRAIN_SPEED = 40, ROGUE_GAP = 6, ROGUE_WARNING = 1;
const PALETTE = [
  { hex: 0x3B7BFF, side: 0x163A8C },
  { hex: 0xFF8A1F, side: 0xA94F05 },
  { hex: 0x2FBF71, side: 0x1B7A46 }
];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 1, 220);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const skyLight = new THREE.HemisphereLight(0xffffff, 0x445066, 0.8);
scene.add(skyLight);
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(-7, 18, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);

// Every person is planned a seat up front, so buses fill exactly and nobody is left over.
function planBuses(current) {
  const plan = [];
  const regular = current.boss ? current.goal - 1 : current.goal;
  for (let i = 0; i < regular; i++) {
    const twoTone = current.mixed && Math.random() < current.mixedChance;
    plan.push({ colour: twoTone ? -1 : i % current.colours, seats: current.seats, size: 1 });
  }
  for (let i = plan.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [plan[i], plan[j]] = [plan[j], plan[i]];
  }
  if (current.boss) {
    const share = Math.floor(current.seats * current.bossSize / current.colours);
    plan.push({ colour: -1, any: true, seats: share * current.colours, size: current.bossSize });
  }
  return plan;
}

function crowdFromPlan(plan, colours) {
  const counts = [0, 0, 0];
  plan.forEach((bus) => {
    if (bus.any) for (let c = 0; c < colours; c++) counts[c] += bus.seats / colours;
    else if (bus.colour < 0) { counts[0] += bus.seats / 2; counts[1] += bus.seats / 2; }
    else counts[bus.colour] += bus.seats;
  });
  return counts;
}

function busFits(bus, stop) {
  const reach = layout.reachable[stop], colours = LEVELS[level].colours;
  if (bus.any) return [0, 1, 2].slice(0, colours).every((c) => reach.has(c));
  return bus.colour < 0 ? reach.has(0) && reach.has(1) : reach.has(bus.colour);
}

function takeBus(stop, preferred) {
  const pile = pileAt[stop];
  const score = (bus) => {
    if (bus.any) return plannedBuses.length > 1 ? -1 : 0;
    if (bus.colour === preferred) return 100000;
    return bus.colour < 0 ? pile[0] + pile[1] : pile[bus.colour];
  };
  let best = -1;
  plannedBuses.forEach((bus, i) => {
    if (busFits(bus, stop) && (best < 0 || score(bus) > score(plannedBuses[best]))) best = i;
  });
  return best < 0 ? null : plannedBuses.splice(best, 1)[0];
}

function showNext(stop) {
  const s = layout.stopSpots[stop];
  reserved[stop] = takeBus(stop);
  if (previews[stop]) scene.remove(previews[stop]);
  previews[stop] = null;

  previews[stop] = makeBus(reserved[stop].colour, stop);

  previews[stop].position.set(s.x + s.dx * (EXIT_LENGTH + 2.9), 0, s.z + s.dz * (EXIT_LENGTH + 2.9));
}

function parkBus(stop, plan = reserved[stop]) {
  if (!plan) return;
  const s = layout.stopSpots[stop];
  const mesh = makeBus(plan.colour, stop);
  const x = s.x + s.dx * (EXIT_LENGTH + 0.85);

  if (plan.any) announce('The giant bus! Send everyone to it');
  showNext(stop);
}

function buildRoads(current) {
  roadGroup.clear();
  layout.rects = [];
  const road = (cx, cz, w, d) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.02, d), roadMaterial);
    mesh.position.set(cx, 0, cz);
    mesh.receiveShadow = true;
    roadGroup.add(mesh);
    layout.rects.push({ cx, cz, w, d });
  };
  layout.sources.forEach((source) => {
    if (source.colour >= current.colours) return;
    const [dx, dz] = PORT[source.port], [x, z] = layout.discs[source.disc];
    road(x + dx * 22, z + dz * 22, dx ? 44 : 2.2, dz ? 44 : 2.2);
  });
  layout.linkPaths.forEach((l) => {
    const middle = l.length / 2;
    road(l.x + l.dx * middle, l.z + l.dz * middle, l.dx ? l.length + 2 : 2.2, l.dz ? l.length + 2 : 2.2);
  });
  layout.stopSpots.forEach((s) => {
    const length = EXIT_LENGTH + 2;
    road(s.x + s.dx * length / 2, s.z + s.dz * length / 2, s.dx ? length : 2.2, s.dz ? length : 2.2);
  });
  layout.discs.forEach(([x, z]) => layout.rects.push({ cx: x, cz: z, w: 6.2, d: 6.2 }));
  layout.stopSpots.forEach((s) => layout.rects.push({ cx: s.x + s.dx * (EXIT_LENGTH + 2.9), cz: s.z + s.dz * (EXIT_LENGTH + 2.9), w: 5.4, d: 5.4 }));
}

function refreshCity() {
  const current = LEVELS[level];
  const progress = level / (LEVEL_COUNT - 1);
  const density = 0.3 + 0.7 * Math.min(1, progress * 1.5);
  const mainLink = layout.linkPaths[0];
  const railX = mainLink.x + mainLink.dx * mainLink.length / 2, railZ = mainLink.z + mainLink.dz * mainLink.length / 2;
  const dummy = new THREE.Object3D();
  let treeCount = 0;

  citySlots.forEach((slot) => {
    const clearance = Math.min(...layout.rects.map((r) => Math.max(Math.abs(slot.x - r.cx) - r.w / 2, Math.abs(slot.z - r.cz) - r.d / 2)));
    const underLandmark = Object.keys(landmarkMeshes).some((id) => {
      const [x, z] = layout.landmarks[id], [halfX, halfZ] = LANDMARK_SIZE[id];
      return Math.abs(slot.x - x) < halfX + 0.8 && Math.abs(slot.z - z) < halfZ + 0.8;
    });
    const onRail = current.train && (mainLink.dx ? Math.abs(slot.x - railX) < 1.4 : Math.abs(slot.z - railZ) < 1.4);
    const free = clearance >= 0.8 && !underLandmark && !onRail;
    const built = free && slot.order < density;
    slot.mesh.visible = built;
    if (built) {
      const wanted = (0.45 + slot.shape * 1.7) * (0.55 + 1.5 * progress) * theme.tall;
      const height = Math.max(0.35, Math.min(wanted, 0.7 + clearance * 1.1));
      slot.mesh.scale.y = height;
      slot.mesh.position.y = height / 2;
    } else if (free && slot.shape < theme.trees) {
      dummy.position.set(slot.x, 0.75, slot.z);
      dummy.scale.setScalar(0.75 + slot.order * 0.6);
      dummy.updateMatrix();
      trees.setMatrixAt(treeCount++, dummy.matrix);
    }
  });
  trees.count = treeCount;
  trees.instanceMatrix.needsUpdate = true;
}

function applyWorld() {
  const current = LEVELS[level];
  theme = WORLDS[current.world].theme;
  layout = layoutFor(current.layoutKey);
  discs = allDiscs.slice(0, layout.discs.length);
  allDiscs.forEach((d, i) => {
    const spot = layout.discs[i];
    d.group.visible = !!spot;
    if (!spot) return;
    d.x = spot[0];
    d.z = spot[1];
    d.group.position.set(d.x, 0, d.z);
  });

  scene.background = new THREE.Color(theme.ground);
  groundMaterial.color.setHex(theme.ground);
  roadMaterial.color.setHex(theme.road);
  arcMaterial.color.setHex(theme.road);
  theme.blocks.forEach((hex, i) => blockMaterials[i].color.setHex(hex));
  treeMaterial.color.setHex(theme.tree);
  sun.color.setHex(theme.sunColour);

  buildRoads(current);
  Object.keys(landmarkMeshes).forEach((id) => {
    const [x, z] = layout.landmarks[id];
    landmarkMeshes[id].position.set(x, 0, z);
  });

  rail.visible = current.train;
  const mainLink = layout.linkPaths[0];
  rail.position.x = mainLink.x + mainLink.dx * mainLink.length / 2;
  rail.position.z = mainLink.z + mainLink.dz * mainLink.length / 2;
  rail.rotation.y = mainLink.dz ? Math.PI / 2 : 0;
  trainMesh.rotation.y = rail.rotation.y;

  particles.visible = !!theme.particle;
  if (theme.particle) {
    const tint = new THREE.Color();
    motes.forEach((_, i) => particles.setColorAt(i, tint.setHex(theme.particle.colours[i % theme.particle.colours.length])));
    particles.instanceColor.needsUpdate = true;
  }

  refreshCity();
  resize();
}

function startLevel(index) {
  level = index;
  runId++;
  filled = streak = shake = 0;
  started = over = won = false;

  buses.forEach((b, i) => { if (b) { scene.remove(b.mesh); buses[i] = null; } });
  previews.forEach((p, i) => { if (p) { scene.remove(p); previews[i] = null; } });
  applyWorld();

  const current = LEVELS[index];
  allDiscs.forEach((d) => {
    d.k = 0;
    d.target = d.angle = d.warn = d.locked = d.flip = 0;
    d.group.rotation.y = 0;
    d.plate.material.color.setHex(theme.plate);
  });

  ambulance = null;
  ambulanceClock = 4;
  lockClock = 5;
  train = null;
  trainClock = 6;
  rogueClock = ROGUE_GAP;
  strikes = 0;
  timeLeft = current.timeLimit || 0;
  Object.keys(timers).forEach((key) => { timers[key] = 0; });
  dangerZone.visible = ambulanceMesh.visible = trainMesh.visible = false;
  Object.keys(POWER_LABELS).forEach((key) => {
    charges[key] = current.powers.includes(key) ? POWER_CHARGES + (extra[key] || 0) : 0;
  });
  plannedBuses = planBuses(current);
  const counts = crowdFromPlan(plannedBuses, current.colours);
  startingCrowd = counts[0] + counts[1] + counts[2];
  crowd = allPeople.slice(0, startingCrowd);
  people.count = crowd.length;
  people.material = current.night ? glowMaterial : dayMaterial;
  const tint = new THREE.Color();
  waiting = counts.slice();
  piled = [0, 0, 0];
  walking = [0, 0, 0];
  pileAt.forEach((pile) => pile.fill(0));
  reserved.fill(null);
  winning = false;
  let person = 0;
  counts.forEach((count, colour) => {
    // Each river is one long line reaching back off-screen, so it flows without a gap until its last person.
    const lineLength = count / current.rate * 8.25 * current.speed;
    for (let i = 0; i < count; i++) {
      const p = crowd[person];
      p.src = colour;
      people.setColorAt(person, tint.setHex(PALETTE[colour].hex));
      Object.assign(p, { phase: 0, s: GATE - 0.5 - (i / count) * lineLength, stopped: false, u: 0 });
      person++;
    }
  });
  people.instanceColor.needsUpdate = true;
  countdownLeft = 3;

  surge = [0, 0, 0];
  schoolClock = SCHOOL_GAP;
  officesFired = stadiumFired = false;
  announceLeft = 0;
  paused = false;
  document.getElementById('levels').style.display = 'none';
  document.getElementById('end').style.display = 'none';
  stuck.fill(0);
  flyers.forEach((f) => scene.remove(f.mesh));
  flyers.length = 0;
  bits.forEach((b) => scene.remove(b.mesh));
  bits = [];

  // The opening buses match the rivers, so the first flow boards correctly.
  const startingRoutes = layout.discs.map(() => 0);
  const matched = {};
  layout.sources.forEach((source) => {
    if (source.colour >= current.colours) return;
    const stop = routeOf(layout, source, startingRoutes);
    if (stop !== null) matched[stop] = source.colour;
  });
  activeStops().forEach((stop) => {
    reserved[stop] = takeBus(stop, matched[stop]);
    parkBus(stop);
  });

  document.getElementById('hint').textContent = current.intro;
  updateHud();
  showCard();
  save();
}

function updateHud() {
  document.getElementById('coins').textContent = coins;
  const current = LEVELS[level];
  const extras = [];
  if (current.timeLimit) extras.push(`${Math.ceil(timeLeft)}s`);
  if (current.maxStrikes) extras.push(`Strikes ${strikes}/${current.maxStrikes}`);
  document.getElementById('progress').textContent = [WORLDS[current.world].name, `Level ${level + 1}`, `${totalWaiting()} left`, ...extras].join(' · ');
  Object.keys(POWER_LABELS).forEach((id) => {
    const button = document.getElementById(id);
    button.style.display = current.powers.includes(id) ? '' : 'none';
    button.textContent = `${POWER_LABELS[id]} ×${charges[id]}`;
    button.disabled = charges[id] === 0;
  });
}

// People taken by the Flush vans no longer need seats, so later buses shrink to stay exactly full.
function shrinkBusesFor(count, colour) {
  let left = count;
  const queued = [...plannedBuses, ...reserved.filter(Boolean)];
  queued.filter((b) => b.colour === colour).forEach((b) => {
    const cut = Math.min(left, b.seats - 1);
    b.seats -= cut;
    left -= cut;
  });
  buses.forEach((bus) => {
    if (!bus || left === 0) return;
    const cut = Math.min(left, bus.quota[colour] - bus.boarded[colour] - bus.called[colour]);
    bus.quota[colour] -= cut;
    bus.seats -= cut;
    left -= cut;
  });
  queued.filter((b) => b.colour === -1).forEach((b) => {
    const cut = Math.min(left, Math.max(0, b.seats - 2));
    b.seats -= cut;
    b.shrunk = b.shrunk || [0, 0, 0];
    b.shrunk[colour] += cut;
    left -= cut;
  });
}

function flushMess() {
  layout.stopSpots.forEach((s, stop) => {
    if (!stuck[stop]) return;
    const van = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1, 3), standard(0xF3F5F7));
    van.position.set(s.x + s.dx * EXIT_LENGTH, 0.5, s.z + s.dz * EXIT_LENGTH);
    if (s.dz) van.rotation.y = Math.PI / 2;
    scene.add(van);
    flyers.push({ mesh: van, dx: s.dx, dz: s.dz, speed: 6 });
  });
  const taken = [0, 0, 0];
  crowd.forEach((p) => {
    if (p.phase !== 3) return;
    leavePile(p);
    p.phase = 6;
    waiting[p.src]--;
    taken[p.src]++;
  });
  taken.forEach(shrinkBusesFor);
  shake = 0.5;
  document.getElementById('flash').animate([{ opacity: 0.25 }, { opacity: 0 }], 180);
}

function swapColours() {
  const parked = buses.filter((b, stop) => stop > 0 && b && b.parked && b.colour >= 0);
  const first = parked.length ? parked[0].colour : 0;
  parked.forEach((b, i) => {
    b.colour = i + 1 < parked.length ? parked[i + 1].colour : first;
    b.mesh.children[0].material = sides[b.colour];
    b.mesh.children[1].material = bodies[b.colour];
  });
}

function usePower(key) {
  if (over || !charges[key]) return;
  charges[key]--;
  if (key === 'flush') flushMess();
  else if (key === 'swap') swapColours();
  else timers[key] = POWER_TIME[key];
  beep(key === 'flush' ? 620 : 300, 0.3, 0.25);
  updateHud();
}

function addStrike() {
  const max = LEVELS[level].maxStrikes;
  if (!max) return;
  strikes++;
  updateHud();
  announce(`Strike ${strikes} of ${max}!`);
  shake = 0.7;
  beep(110, 0.4, 0.3);
  if (strikes >= max) endLevel(false, 'Too many hits');
}

function launchPeople() {
  const main = layout.linkPaths[0];
  let flung = 0;
  crowd.forEach((p) => {
    if (p.phase !== 4 || p.link !== 0) return;
    const along = p.forward ? p.u : main.length - p.u;
    if (Math.abs(along - main.length / 2) > 1.6) return;
    Object.assign(p, { phase: 5, fx: main.x + main.dx * along + main.dz * p.lat, fy: 0.3, fz: main.z + main.dz * along + main.dx * p.lat, vx: (Math.random() - 0.5) * 12, vy: 8 + Math.random() * 9, vz: (Math.random() - 0.5) * 18 });
    flung++;
  });
  shake = 0.7;
  beep(120, 0.3, 0.3);
  if (flung >= TRAIN_STRIKE_HITS) addStrike();
  if (totalMess() >= LEVELS[level].maxMess) endLevel(false);
}

function updateTrain(dt, time) {
  const main = layout.linkPaths[0];
  const midX = main.x + main.dx * main.length / 2, midZ = main.z + main.dz * main.length / 2;
  if (!train) {
    trainClock -= dt;
    if (trainClock <= 0) {
      train = { warn: TRAIN_WARNING, along: -30, hit: false };
      announce('Train coming! Clear the bridge');
      beep(990, 0.4, 0.25);
    }
    return;
  }
  if (train.warn > 0) {
    train.warn -= dt;
    dangerZone.position.set(midX, 0.04, midZ);
    dangerZone.rotation.y = main.dz ? Math.PI / 2 : 0;
    dangerZone.visible = true;
    dangerZone.material.opacity = 0.35 + Math.abs(Math.sin(time * 12)) * 0.5;
    return;
  }
  trainMesh.visible = true;
  train.along += TRAIN_SPEED * dt;
  trainMesh.position.set(midX + main.dz * train.along, 0, midZ + main.dx * train.along);
  if (!train.hit && train.along > -6) {
    train.hit = true;
    launchPeople();
  }
  if (train.along > 30) {
    train = null;
    trainMesh.visible = false;
    trainClock = TRAIN_GAP;
  }
}

function updateRogue(dt) {
  rogueClock -= dt;
  if (rogueClock <= 0 && timers.lock <= 0) {
    discs[Math.floor(Math.random() * discs.length)].flip = ROGUE_WARNING;
    rogueClock = ROGUE_GAP;
  }
  discs.forEach((d) => {
    if (!(d.flip > 0)) return;
    d.flip -= dt;
    if (d.flip > 0) return;
    if (timers.lock <= 0 && d.locked <= 0) {
      d.k++;
      d.target += Math.PI / 2;
      shake = Math.max(shake, 0.2);
      beep(200, 0.2, 0.2);
    }
  });
}

function updateAmbulance(dt, time) {
  if (!ambulance) {
    ambulanceClock -= dt;
    if (ambulanceClock <= 0) {
      const options = activeStops().filter((stop) => stop > 0);
      ambulance = { stop: options[Math.floor(Math.random() * options.length)], left: AMBULANCE_WARNING + AMBULANCE_STAY, hits: 0 };
    }
  }
  if (!ambulance) return;
  ambulance.left -= dt;
  const s = layout.stopSpots[ambulance.stop];
  const midX = s.x + s.dx * EXIT_LENGTH / 2, midZ = s.z + s.dz * EXIT_LENGTH / 2;
  ambulance.active = ambulance.left <= AMBULANCE_STAY;
  if (!ambulance.active) {
    dangerZone.position.set(midX, 0.04, midZ);
    dangerZone.rotation.y = s.dx ? Math.PI / 2 : 0;
    dangerZone.visible = true;
    dangerZone.material.opacity = 0.35 + Math.abs(Math.sin(time * 12)) * 0.5;
  } else if (!ambulanceMesh.visible) {
    ambulanceMesh.visible = true;
    ambulanceMesh.position.set(midX, 8, midZ);
    ambulanceMesh.rotation.y = s.dx ? Math.PI / 2 : 0;
    shake = Math.max(shake, 0.2);
    beep(880, 0.2, 0.2);
  }
  if (ambulanceMesh.visible) ambulanceMesh.position.y = Math.max(0, ambulanceMesh.position.y - dt * 40);
  if (ambulance.left <= 0) {
    if (ambulance.hits >= AMBULANCE_STRIKE_HITS) addStrike();
    ambulance = null;
    ambulanceMesh.visible = false;
    ambulanceClock = AMBULANCE_GAP;
  }
}

function updateParticles(dt, time) {
  if (!theme.particle) return;
  const { speed, size, tall } = theme.particle;
  const m = particles.instanceMatrix.array;
  motes.forEach((mote, i) => {
    mote.y -= speed * dt;
    if (mote.y < 0) mote.y = 16;
    const x = mote.x + Math.sin(time + mote.drift) * 0.6;
    m[i * 16] = size;
    m[i * 16 + 5] = tall ? size * 8 : size;
    m[i * 16 + 10] = size;
    m[i * 16 + 12] = x;
    m[i * 16 + 13] = mote.y;
    m[i * 16 + 14] = mote.z;
  });
  particles.instanceMatrix.needsUpdate = true;
}

function updateHazards(dt, time) {
  Object.keys(timers).forEach((key) => { timers[key] = Math.max(0, timers[key] - dt); });
  dangerZone.visible = false;
  const current = LEVELS[level];
  const lit = !current.night || timers.flood > 0 || Math.sin(time * 2.4) > 0.82;
  skyLight.intensity = lit ? theme.sky : 0.08;
  sun.intensity = lit ? theme.sun : 0.05;
  Object.values(landmarkMeshes).forEach((m) => {
    if (m.position.y > 0) {
      m.position.y = Math.max(0, m.position.y - dt * 30);
      if (m.position.y === 0) shake = 0.7;
    }
  });
  updateParticles(dt, time);

  if (!started && !over && countdownLeft > 0) {
    countdownLeft -= dt;
    const el = document.getElementById('countdown');
    if (countdownLeft > 0) {
      const number = Math.ceil(countdownLeft);
      if (el.textContent !== String(number)) {
        el.textContent = number;
        beep(392, 0.2, 0.15);
      }
    } else {
      el.textContent = 'Go!';
      started = true;
      beep(784, 0.4, 0.2);
      setTimeout(() => { el.textContent = ''; }, 500);
    }
  }
  if (current.singleDisc) discs[1].plate.material.color.setHex(PLATE_ASLEEP);
  if (!started || over) return;

  if (current.timeLimit) {
    const shown = Math.ceil(timeLeft);
    timeLeft -= dt;
    if (Math.ceil(timeLeft) !== shown) updateHud();
    if (timeLeft <= 0) {
      endLevel(false, 'Out of time');
      return;
    }
  }
  if (current.train) updateTrain(dt, time);
  if (current.rogue) updateRogue(dt);
  if (current.ambulance) updateAmbulance(dt, time);

  surge = surge.map((s) => Math.max(0, s - dt));
  if (announceLeft > 0) {
    announceLeft -= dt;
    if (announceLeft <= 0) document.getElementById('hint').textContent = '';
  }
  if (owned.school && level >= 10 && !current.calm) {
    schoolClock -= dt;
    if (schoolClock <= 0) {
      schoolClock = SCHOOL_GAP;
      surge[0] = SCHOOL_SURGE;
      announce('School bell! Blue surge');
      beep(780, 0.3, 0.2);
    }
  }
  if (owned.offices && level >= 20 && !current.calm && !officesFired) {
    officesFired = true;
    surge[1] = OFFICE_SURGE;
    announce('Morning rush! Orange surge');
  }
  if (owned.stadium && level >= 30 && !current.calm && !stadiumFired && totalWaiting() <= startingCrowd / 2) {
    stadiumFired = true;
    surge[0] = surge[1] = STADIUM_SURGE;
    shake = 0.7;
    announce('Full time! Everyone surges');
    beep(330, 0.5, 0.3);
  }

  if (current.roadworks) {
    lockClock -= dt;
    if (lockClock <= 0) {
      if (timers.lock <= 0) discs[Math.floor(Math.random() * discs.length)].warn = LOCK_WARNING;
      lockClock = LOCK_GAP;
    }
  }
  discs.forEach((d, i) => {
    if (d.warn > 0) {
      d.warn -= dt;
      if (d.warn <= 0) d.locked = LOCK_TIME;
    } else if (d.locked > 0) {
      d.locked -= dt;
    }
    if (!(current.singleDisc && i === 1)) d.plate.material.color.setHex(d.flip > 0 ? PLATE_ROGUE : d.locked > 0 ? PLATE_LOCKED : d.warn > 0 ? PLATE_WARN : theme.plate);
  });
}

function endLevel(cleared, reason = 'Total mess') {
  if (over) return;
  over = true;
  won = cleared;
  const last = level === LEVEL_COUNT - 1;
  if (cleared) {
    extra = { flush: 0, slow: 0 };
    beaten = Math.max(beaten, level + 1);
  }
  document.getElementById('headline').textContent = !cleared ? reason : last ? 'You ran the city' : 'Level cleared';
  document.getElementById('next').textContent = !cleared ? 'Try again' : last ? 'Play it again' : 'Next level';
  document.getElementById('shop').style.display = cleared && !last ? 'flex' : 'none';
  updateShop();
  document.getElementById('end').style.display = 'flex';
  save();
}

const buildingAfter = (index) => BUILDINGS.find((b) => b.afterLevel === index);

function isUnlocked(index) {
  if (OPEN_ALL_LEVELS || index === 0) return true;
  const required = buildingAfter(index - 1);
  return beaten >= index && (!required || !!owned[required.id]);
}

function showWorld(world) {
  document.getElementById('worldTabs').replaceChildren(...WORLDS.map((w, i) => {
    const tab = document.createElement('button');
    tab.textContent = `${i + 1}. ${w.name}`;
    tab.className = i === world ? 'current' : '';
    tab.onclick = () => showWorld(i);
    return tab;
  }));
  document.getElementById('levelList').replaceChildren(...LEVELS.slice(world * 10, world * 10 + 10).map((_, step) => {
    const i = world * 10 + step;
    const button = document.createElement('button');
    const required = buildingAfter(i - 1);
    const requirement = beaten < i ? `beat level ${i}` : required && !owned[required.id] ? `needs ${required.name}` : '';
    button.textContent = isUnlocked(i) ? `Level ${i + 1}` : `Level ${i + 1} · ${requirement}`;
    button.disabled = !isUnlocked(i);
    button.onclick = () => startLevel(i);
    return button;
  }));
}

function openLevels() {
  paused = true;
  showWorld(LEVELS[level].world);
  document.getElementById('levels').style.display = 'flex';
}

function closeLevels() {
  paused = document.getElementById('card').style.display === 'flex';
  document.getElementById('levels').style.display = 'none';
}

function updateShop() {
  const summary = document.getElementById('summary');
  const next = document.getElementById('next');
  updateHud();
  if (!over) return;
  if (!won) {
    summary.textContent = `${totalWaiting()} people were still waiting.`;
    next.disabled = false;
    return;
  }
  if (level === LEVEL_COUNT - 1) {
    summary.textContent = `Final score: ${coins} coins.`;
    next.disabled = false;
    return;
  }
  const building = buildingAfter(level);
  const built = !building || !!owned[building.id];
  const build = document.getElementById('build');
  build.style.display = building ? '' : 'none';
  if (building) {
    summary.textContent = built ? `${coins} coins left. ${building.name} built.` : `${coins} coins. Build the ${building.name} to unlock level ${level + 2}. ${building.pitch}`;
    build.textContent = built ? `${building.name} built` : `Build ${building.name}: ${building.price}`;
    build.disabled = built || coins < building.price;
  } else {
    summary.textContent = `${coins} coins. Level ${level + 2} is open.`;
  }
  next.disabled = !built && !OPEN_ALL_LEVELS;
  const upcoming = LEVELS[level + 1].powers;
  [['buyFlush', 'flush', 'Flush'], ['buySlow', 'slow', 'Slow']].forEach(([id, key, label]) => {
    const button = document.getElementById(id);
    button.style.display = built && upcoming.includes(key) ? '' : 'none';
    button.textContent = `+1 ${label}: ${EXTRA_PRICE} (${extra[key]}/${MAX_EXTRA})`;
    button.disabled = coins < EXTRA_PRICE || extra[key] >= MAX_EXTRA;
  });
}

function buyBuilding() {
  const building = buildingAfter(level);
  if (!building || owned[building.id] || coins < building.price) return;
  coins -= building.price;
  owned[building.id] = true;
  placeLandmark(building.id, true);
  beep(520, 0.3, 0.25);
  save(level + 1);
  updateShop();
}

function buyExtra(key) {
  if (coins < EXTRA_PRICE || extra[key] >= MAX_EXTRA) return;
  coins -= EXTRA_PRICE;
  extra[key]++;
  beep(620, 0.15, 0.2);
  save(level + 1);
  updateShop();
}

function newGame() {
  coins = 0;
  owned = {};
  extra = { flush: 0, slow: 0 };
  beaten = 0;
  seenCards = {};
  Object.keys(landmarkMeshes).forEach((id) => { scene.remove(landmarkMeshes[id]); delete landmarkMeshes[id]; });
  startLevel(0);
}

function nextLevel() {
  startLevel(won && level < LEVEL_COUNT - 1 ? level + 1 : level);
}

function beep(freq, length, volume) {
  if (!audio) return;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + length);
  osc.connect(gain).connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + length);
}

function twist(d) {
  if (over || !started || !discs[d]) return;
  if (LEVELS[level].singleDisc && d > 0) return;
  if (discs[d].locked > 0) {
    beep(90, 0.15, 0.2);
    return;
  }
  discs[d].k++;
  discs[d].target += Math.PI / 2;
  shake = Math.max(shake, 0.12);
  beep(150, 0.14, 0.2);
  if (announceLeft <= 0) document.getElementById('hint').textContent = '';
}

function burst(stop) {
  const bus = buses[stop];
  buses[stop] = null;
  const s = layout.stopSpots[stop];
  flyers.push({ mesh: bus.mesh, dx: s.dx, dz: s.dz, speed: 6 });
  streak++;
  const lockedBonus = discs.some((d) => d.locked > 0);
  const gain = Math.round(100 * streak * coinMultiplier() * (lockedBonus ? 2 : 1));
  if (lockedBonus) announce('Locked bonus: double coins!');
  coins += gain;
  const current = LEVELS[level];
  filled++;
  updateHud();
  shake = 0.7;
  document.getElementById('flash').animate([{ opacity: 0.35 }, { opacity: 0 }], 180);

  for (let i = 0; i < 90; i++) {
    const mesh = new THREE.Mesh(coinGeometry, coinMaterial);
    mesh.position.copy(bus.mesh.position).setY(1.2);
    scene.add(mesh);
    const a = Math.random() * 6.28, power = 3 + Math.random() * 7;
    bits.push({ mesh, vx: Math.cos(a) * power, vz: Math.sin(a) * power, vy: 8 + Math.random() * 10, life: 1.3 });
  }

  const p = bus.mesh.position.clone().setY(1.5).project(camera);
  const el = document.createElement('span');
  el.className = 'gain';
  el.textContent = '+' + gain;
  el.style.left = (p.x + 1) / 2 * innerWidth + 'px';
  el.style.top = (1 - p.y) / 2 * innerHeight + 'px';
  el.onanimationend = () => el.remove();
  document.body.append(el);

  beep(440 + streak * 30, 0.25, 0.25);
  const run = runId;
  setTimeout(() => { if (run === runId && !over) parkBus(stop); }, 450);
}

function joinPile(p, x, z) {
  p.phase = 3;
  p.stopped = true;
  p.px = x;
  p.pz = z;
  piled[p.src]++;
  pileAt[p.stop][p.src]++;
  stuck[p.stop]++;
  if (totalMess() >= LEVELS[level].maxMess) endLevel(false);
}

function leavePile(p) {
  piled[p.src]--;
  pileAt[p.stop][p.src]--;
  stuck[p.stop]--;
}

function stick(p) {
  const s = layout.stopSpots[p.stop];
  const along = EXIT_LENGTH - Math.random() * 2.4, across = (Math.random() * 2 - 1) * 1.05;
  joinPile(p, s.x + s.dx * along + s.dz * across, s.z + s.dz * along + s.dx * across);
}

function landOnPile(p) {
  const options = activeStops();
  p.stop = options.reduce((best, stop) => {
    const a = layout.stopSpots[stop], b = layout.stopSpots[best];
    return Math.hypot(a.x - p.fx, a.z - p.fz) < Math.hypot(b.x - p.fx, b.z - p.fz) ? stop : best;
  }, options[0]);
  joinPile(p, p.fx, p.fz);
}

const seatsOpen = (bus) => bus.seats - bus.fill - bus.called[0] - bus.called[1] - bus.called[2];
const wantsPerson = (bus, colour) => bus.boarded[colour] + bus.called[colour] < bus.quota[colour];

function seatQuota(plan) {
  const colours = LEVELS[level].colours, shrunk = plan.shrunk || [0, 0, 0];
  const total = plan.seats + shrunk[0] + shrunk[1] + shrunk[2];
  if (plan.any) return [0, 1, 2].map((c) => (c < colours ? total / colours - shrunk[c] : 0));
  if (plan.colour < 0) return [total / 2 - shrunk[0], total / 2 - shrunk[1], 0];
  return [0, 1, 2].map((c) => (c === plan.colour ? plan.seats : 0));
}

function board(bus, p) {
  if (p.phase === 3) leavePile(p);
  bus.fill++;
  bus.boarded[p.src]++;
  bus.wobble = 1;
  p.phase = 6;
  waiting[p.src]--;
  updateHud();
}

function arrive(p) {
  const bus = buses[p.stop];
  if (bus && bus.parked && seatsOpen(bus) > 0 && wantsPerson(bus, p.src)) {
    board(bus, p);
    if (bus.fill >= bus.seats) burst(p.stop);
    return;
  }
  stick(p);
}

const PILE_BOARDING_PER_FRAME = 6;

function boardFromPile(bus, stop) {
  if (!stuck[stop]) return;
  let boarded = 0;
  for (const p of crowd) {
    if (boarded === PILE_BOARDING_PER_FRAME || seatsOpen(bus) <= 0) break;
    if (p.phase === 3 && p.stop === stop && wantsPerson(bus, p.src)) {
      board(bus, p);
      boarded++;
    }
  }
}

// When a river has run dry, people stranded at other stops walk over to the bus that needs them.
function callStrandedPeople(bus, stop) {
  let called = 0;
  for (const p of crowd) {
    if (called === PILE_BOARDING_PER_FRAME || seatsOpen(bus) <= 0) return;
    if (p.phase !== 3 || p.stop === stop) continue;
    const colour = p.src;
    if (waiting[colour] - piled[colour] - walking[colour] > 0) continue;
    if (!wantsPerson(bus, colour)) continue;
    leavePile(p);
    p.phase = 7;
    p.stop = stop;
    walking[colour]++;
    bus.called[colour]++;
    called++;
  }
}

function settleBus(bus, stop) {
  boardFromPile(bus, stop);
  callStrandedPeople(bus, stop);
  if (bus.fill >= bus.seats) burst(stop);
}

// Rare case after a Flush: if the rivers are empty and no bus wants who is left, one bus takes them exactly.
function seatLastPeople() {
  const pileSize = piled[0] + piled[1] + piled[2];
  if (pileSize === 0 || totalWaiting() > pileSize) return;
  const parked = buses.filter((b) => b && b.parked);
  if (parked.some((b) => [0, 1, 2].some((c) => piled[c] > 0 && wantsPerson(b, c)))) return;
  if (parked.length) {
    const bus = parked[0];
    bus.quota = bus.boarded.map((n, c) => n + piled[c]);
    bus.seats = bus.fill + pileSize;
  } else if (!buses.some(Boolean)) {
    parkBus(activeStops()[0], { colour: piled.indexOf(Math.max(...piled)), seats: pileSize, size: 1, any: true });
  }
}

function walkToBus(p, dt) {
  const bus = buses[p.stop];
  if (!bus) {
    walking[p.src]--;
    joinPile(p, p.px, p.pz);
    return;
  }
  const dx = bus.x - p.px, dz = bus.z - p.pz, distance = Math.hypot(dx, dz);
  if (distance < 0.9) {
    walking[p.src]--;
    bus.called[p.src]--;
    board(bus, p);
    return;
  }
  const step = 9 * dt / distance;
  p.px += dx * step;
  p.pz += dz * step;
}

function enterDisc(p, d, world) {
  p.phase = 1;
  p.u = 0;
  p.disc = d;
  p.side = localSide(discs[d], world);
}

function leaveDisc(p) {
  const disc = discs[p.disc];
  const out = otherEnd(p.side);
  const world = (out + disc.k) % 4;
  const target = layout.ports[p.disc][world];
  if (target && target.link === 0 && target.forward && timers.hold > 0) {
    p.u = 0.999;
    return;
  }
  p.u = 0;
  if (target && target.stop !== undefined) {
    p.phase = 2;
    p.stop = target.stop;
  } else if (target && target.link !== undefined) {
    p.phase = 4;
    p.link = target.link;
    p.forward = target.forward;
  } else {
    p.side = out;
  }
}

function advance(p, dt, open) {
  if (p.phase === 3 || p.phase === 6) return;
  if (p.phase === 7) {
    walkToBus(p, dt);
    return;
  }
  if (p.phase === 5) {
    p.vy -= 22 * dt;
    p.fx += p.vx * dt;
    p.fy += p.vy * dt;
    p.fz += p.vz * dt;
    if (p.fy < 0.3 && p.vy < 0) landOnPile(p);
    return;
  }
  if (!open) return;
  const speed = p.speed * LEVELS[level].speed * (timers.slow > 0 ? SLOW_FACTOR : 1) * (surge[p.src] > 0 || timers.boost > 0 ? SURGE_SPEED : 1);
  if (p.phase === 0) {
    p.s += speed * dt;
    if (p.s >= GATE) {
      const source = layout.sources[p.src];
      enterDisc(p, source.disc, source.port);
    }
  } else if (p.phase === 1) {
    p.u += speed * dt / (R * Math.PI / 2);
    if (p.u >= 1) leaveDisc(p);
  } else if (p.phase === 4) {
    p.u += speed * dt;
    const path = layout.linkPaths[p.link];
    if (p.u >= path.length) {
      if (p.forward) enterDisc(p, path.b, path.bPort);
      else enterDisc(p, path.a, path.aPort);
    }
  } else {
    p.u += speed * dt;
    if (ambulance && ambulance.active && ambulance.stop === p.stop && p.u >= 0.8) {
      ambulance.hits++;
      stick(p);
    } else if (p.u >= EXIT_LENGTH) {
      arrive(p);
    }
  }
}

function place(p, i, time) {
  let x, z;
  if (p.phase === 6) {
    people.instanceMatrix.array[i * 16 + 13] = -50;
    return;
  }
  if (p.phase === 3 || p.phase === 7) {
    x = p.px;
    z = p.pz;
  } else if (p.phase === 5) {
    x = p.fx;
    z = p.fz;
  } else if (p.phase === 0) {
    const source = layout.sources[p.src];
    const [dx, dz] = PORT[source.port], [ox, oz] = layout.discs[source.disc];
    const distance = ROAD_LENGTH - p.s;
    x = ox + dx * distance + dz * p.lat;
    z = oz + dz * distance + dx * p.lat;
  } else if (p.phase === 1) {
    const disc = discs[p.disc];
    const first = p.side % 2 === 0;
    const t = (first ? p.u : 1 - p.u) * Math.PI / 2;
    const r = R + p.lat;
    const lx = p.side < 2 ? R - r * Math.cos(t) : -R + r * Math.cos(t);
    const lz = p.side < 2 ? -R + r * Math.sin(t) : R - r * Math.sin(t);
    const c = Math.cos(disc.angle), s = Math.sin(disc.angle);
    x = disc.x + lx * c - lz * s;
    z = disc.z + lx * s + lz * c;
  } else if (p.phase === 4) {
    const path = layout.linkPaths[p.link];
    const along = p.forward ? p.u : path.length - p.u;
    x = path.x + path.dx * along + path.dz * p.lat;
    z = path.z + path.dz * along + path.dx * p.lat;
  } else {
    const s = layout.stopSpots[p.stop];
    const squeeze = 1 - Math.pow(p.u / EXIT_LENGTH, 2) * 0.85;
    x = s.x + s.dx * p.u + s.dz * p.lat * squeeze;
    z = s.z + s.dz * p.u + s.dx * p.lat * squeeze;
  }
  const hop = p.stopped && p.phase !== 7 ? 0 :Math.abs(Math.sin(time * 14 + p.bob)) * 0.12;
  const m = people.instanceMatrix.array;
  m[i * 16 + 12] = x;
  m[i * 16 + 13] = p.phase === 5 ? p.fy : 0.26 + hop;
  m[i * 16 + 14] = z;
}

function step(dt, time) {
  discs.forEach((d) => {
    d.angle += (d.target - d.angle) * Math.min(1, dt * 13);
    d.group.rotation.y = -d.angle;
  });

  updateHazards(dt, time);

  crowd.forEach((p, i) => {
    advance(p, dt, started);
    place(p, i, time);
  });
  people.instanceMatrix.needsUpdate = true;
  document.getElementById('fill').style.width = Math.min(100, totalMess() / LEVELS[level].maxMess * 100) + '%';

  if (started && !over) {
    seatLastPeople();
    if (!winning && totalWaiting() === 0) {
      winning = true;
      const run = runId;
      setTimeout(() => { if (run === runId) endLevel(true); }, 700);
    }
  }
  buses.forEach((bus, stop) => {
    if (!bus) return;
    if (bus.parked && started && !over) settleBus(bus, stop);
    if (!buses[stop] || buses[stop] !== bus) return;
    if (!bus.parked) {
      bus.y = Math.max(0, bus.y - dt * 42);
      if (bus.y === 0) { bus.parked = true; shake = Math.max(shake, 0.25); }
    }
    bus.wobble = Math.max(0, bus.wobble - dt * 5);
    const swell = bus.size * (1 + (bus.fill / bus.seats) * 0.75);
    const jitter = Math.sin(time * 60) * 0.05 * bus.wobble;
    bus.mesh.position.set(bus.x, bus.y, bus.z);
    bus.mesh.scale.set(swell + jitter, swell * (1 + jitter), swell - jitter);
  });

  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    f.speed += dt * 150;
    f.mesh.position.x += f.dx * f.speed * dt;
    f.mesh.position.z += f.dz * f.speed * dt;
    if (Math.abs(f.mesh.position.x) + Math.abs(f.mesh.position.z) > 60) {
      scene.remove(f.mesh);
      flyers.splice(i, 1);
    }
  }

  bits = bits.filter((b) => {
    b.life -= dt;
    b.vy -= dt * 30;
    b.mesh.position.x += b.vx * dt;
    b.mesh.position.y = Math.max(0.05, b.mesh.position.y + b.vy * dt);
    b.mesh.position.z += b.vz * dt;
    b.mesh.rotation.x += dt * 16;
    if (b.life <= 0) { scene.remove(b.mesh); return false; }
    return true;
  });

  shake = Math.max(0, shake - dt * 2.2);
  camera.position.copy(camera.userData.base);
  camera.position.x += (Math.random() - 0.5) * shake;
  camera.position.z += (Math.random() - 0.5) * shake;
  camera.lookAt(camera.userData.look);
}

function resize() {
  const aspect = innerWidth / innerHeight;
  const tan = Math.tan(THREE.MathUtils.degToRad(15));
  const [viewW, viewH] = layout.view;
  const distance = Math.max(viewW / (2 * tan * aspect), viewH / (2 * tan));
  camera.userData.look = new THREE.Vector3(layout.look[0], 0, layout.look[1]);
  camera.userData.base = new THREE.Vector3(0, 0.93, 0.36).normalize().multiplyScalar(distance).add(camera.userData.look);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

renderer.domElement.addEventListener('pointerdown', (e) => {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  raycaster.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: 1 - e.clientY / innerHeight * 2 }, camera);
  const point = raycaster.ray.intersectPlane(groundPlane, new THREE.Vector3());
  if (!point) return;
  let nearest = 0, best = Infinity;
  discs.forEach((d, i) => {
    const distance = Math.hypot(point.x - d.x, point.z - d.z);
    if (distance < best) { best = distance; nearest = i; }
  });
  twist(nearest);
});
addEventListener('resize', resize);
document.getElementById('next').onclick = nextLevel;
Object.keys(POWER_LABELS).forEach((key) => { document.getElementById(key).onclick = () => usePower(key); });
document.getElementById('levelsButton').onclick = openLevels;
document.getElementById('endLevels').onclick = openLevels;
document.getElementById('closeLevels').onclick = closeLevels;
document.getElementById('cardOk').onclick = closeCard;
document.getElementById('build').onclick = buyBuilding;
document.getElementById('buyFlush').onclick = () => buyExtra('flush');
document.getElementById('buySlow').onclick = () => buyExtra('slow');
document.getElementById('newGame').onclick = () => { if (confirm('Start over and lose your city?')) newGame(); };

loadSave();
layout = layoutFor(LEVELS[level].layoutKey);
buildRoads(LEVELS[level]);
Object.keys(owned).forEach((id) => placeLandmark(id, false));
resize();
startLevel(level);

let last = performance.now();
function frame(now) {
  if (!paused) step(Math.min((now - last) / 1000, 0.05), now / 1000);
  last = now;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
