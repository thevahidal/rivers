function roundedBox(w, h, d, r) {
  const x = w / 2 - r, z = d / 2 - r;
  const shape = new THREE.Shape();
  shape.moveTo(-x, -z - r);
  shape.lineTo(x, -z - r);
  shape.absarc(x, -z, r, -Math.PI / 2, 0);
  shape.lineTo(x + r, z);
  shape.absarc(x, z, r, 0, Math.PI / 2);
  shape.lineTo(-x, z + r);
  shape.absarc(-x, z, r, Math.PI / 2, Math.PI);
  shape.lineTo(-x - r, -z);
  shape.absarc(-x, -z, r, Math.PI, Math.PI * 1.5);
  const bevel = Math.min(r * 0.6, h * 0.3);
  const geometry = new THREE.ExtrudeGeometry(shape, { depth: h - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.5, bevelSegments: 5, curveSegments: 10 });
  geometry.rotateX(-Math.PI / 2);
  geometry.translate(0, bevel - h / 2, 0);
  return geometry;
}
function roundedSlab(w, h, d, r) {
  const x = w / 2 - r, z = d / 2 - r, shape = new THREE.Shape();
  shape.absarc(x, z, r, 0, Math.PI / 2);
  shape.absarc(-x, z, r, Math.PI / 2, Math.PI);
  shape.absarc(-x, -z, r, Math.PI, Math.PI * 1.5);
  shape.absarc(x, -z, r, Math.PI * 1.5, Math.PI * 2);
  const geometry = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 3 });
  geometry.rotateX(-Math.PI / 2);
  geometry.translate(0, -h / 2, 0);
  return geometry;
}
function part(geometry, material, x, y, z, shadow = true) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = shadow;
  mesh.receiveShadow = true;
  return mesh;
}

function islandRects(rects, x0, x1, z0, z1) {

  const zs = cuts(z0, z1, rects.flatMap(([, z, , d]) => [z - d / 2, z + d / 2]));

    const row = [], zm = (zs[j] + zs[j + 1]) / 2;
    for (let i = 0; i < xs.length - 1; i++) {

      const last = row[row.length - 1];

      else row.push({ x0: xs[i], x1: xs[i + 1], z0: zs[j], z1: zs[j + 1] });

      out.push(r);

        if (p.u >= p.walk.total) { p.walk = null; p.s = p.walkS; }
      } else {
        p.s = p.s === p.target ? p.s : Math.max(p.target, p.s - (phase === 'playing' ? WALK * dt : 0));
        [x, z] = linePos(p);
        y += Math.abs(Math.sin(time * 9 + p.bob)) * 0.05;
        if (p.s > room[p.river]) scale = 0;
      }
    } else if (p.state === 'run') {
      const under = p.path.hide && p.u > p.path.hide[0] && p.u < p.path.hide[1];
      p.u += RUN * dt * (under ? 3 : 1);
      [x, z] = sample(p.path, p.u);
      p.x = x; p.z = z;
      y += Math.abs(Math.sin(time * 15 + p.bob)) * 0.16;
      if (under) scale = 0;
      if (p.u >= p.path.total) {
        p.state = 'hop'; p.hop = 0; p.hx = x; p.hz = z;
        if (p.mixTo !== undefined) {
          bodies.setColorAt(p.id, paintColor.setHex(COLOURS[p.mixTo].dark));
          heads.setColorAt(p.id, paintColor.setHex(COLOURS[p.mixTo].body));
          bodies.instanceColor.needsUpdate = heads.instanceColor.needsUpdate = true;
        }
      }
    } else {
      p.hop += dt * 5;
      const t = Math.min(1, p.hop), m = p.bus.mesh.position;
      x = p.hx + (m.x - p.hx) * t;
      z = p.hz + (m.z - p.hz) * t;
      y = 0.39 + Math.sin(t * Math.PI) * 1.1;
      scale = 1 - t * 0.6;
      if (t === 1) { board(p); scale = 0; }
    }
    scratch.position.set(x, y, z);
    scratch.rotation.set(0, 0, 0);
    scratch.scale.setScalar(scale);
    scratch.updateMatrix();
    bodies.setMatrixAt(p.id, scratch.matrix);
    scratch.position.y = y + 0.33 * scale;
    scratch.updateMatrix();
    heads.setMatrixAt(p.id, scratch.matrix);
  });
  bodies.instanceMatrix.needsUpdate = heads.instanceMatrix.needsUpdate = true;
}

function drawBuses(dt, time) {
  if (layout.train) { drawTrain(dt, time); return; }
  stops.forEach((stop, i) => {
    const b = stop.bus, g = GEO[i];
    if (!b) return;
    if (!b.parked) {
      b.mesh.position.y = 0.1;
      if (stepAlong(b, dt, true)) { parkNow(i); b.squash = 1; }
    } else {
      b.mesh.position.x = g.parkX;
      if (g.face !== undefined) { b.mesh.position.z = g.parkZ; b.face = g.face; }
    }
    turnToward(b.mesh, b.face, dt);
    b.size = Math.min(1, b.size + dt * 2.4);
    b.squash = Math.max(0, b.squash - dt * 7);
    const wob = Math.sin(time * 34) * b.squash * 0.05, fat = 1 + b.fill / b.seats * 0.08;
    b.mesh.scale.set(b.size * (fat + wob), b.size * fat * (1 - wob), b.size * (fat + wob));
  });
  for (let i = flying.length - 1; i >= 0; i--) {
    const f = flying[i];
    const done = stepAlong(f, dt, false);
    turnToward(f.mesh, f.face, dt);
    if (done) { world.remove(f.mesh); flying.splice(i, 1); }
  }
}
function drawLot(dt, time) {
  const canLeave = phase === 'playing' && stops.some((s) => !s.bus);
  depot.forEach((lane, l) => lane.forEach((b, j) => {
    const m = b.mesh.position, chosen = picked === l && j === 0;
    const hop = chosen ? 0.5 + Math.abs(Math.sin(time * 10)) * 0.5 : j === 0 && canLeave && !isLocked(b) ? Math.abs(Math.sin(time * 6)) * 0.35 : 0;
    m.z += (LOT_FRONT - j * LOT_PITCH - m.z) * Math.min(1, dt * 10);
    m.y = 0.1 + hop;
    const size = b.mesh.scale.x + ((j === 0 ? FRONT_SCALE : LOT_SCALE) - b.mesh.scale.x) * Math.min(1, dt * 10);
    b.mesh.scale.setScalar(size);
    b.label.classList.toggle('front', j === 0);
    place(b.label, m.x, 2 * size + hop, m.z);
    b.label.style.visibility = parseFloat(b.label.style.top) < titleBottom + 10 ? 'hidden' : '';
  }));
}
function drawPops(dt) {
  const m = new THREE.Matrix4();
  popBits.forEach((b, i) => {
    if (b.life <= 0) return;
    b.life -= dt;
    b.vy -= dt * 20;
    b.x += b.vx * dt;
    b.y = Math.max(0.2, b.y + b.vy * dt);
    b.z += b.vz * dt;
    pops.setMatrixAt(i, b.life <= 0 ? m.makeScale(0, 0, 0) : m.makeTranslation(b.x, b.y, b.z));
  });
  pops.instanceMatrix.needsUpdate = true;
}
function updateLabels() {
  if (!labels.seats) return;
  let options = [];
  if (picked !== null && phase === 'playing') {
    options = allowedStops(snapshot(), seatsOf(depot[picked][0]), CFG);
    if (!options.length) picked = null;
  }
  GEO.forEach((g, i) => {
    const show = picked !== null && options.includes(i);
    labels.here[i].style.display = show ? '' : 'none';
    if (show) place(labels.here[i], g.parkX, 0.3, g.parkZ);
  });
  const view = routeView();
  stops.forEach((stop, i) => {
    const seat = labels.seats[i], b = stop.bus, g = GEO[i];
    seat.style.display = b && b.parked && !b.car ? '' : 'none';
    if (b && b.parked && !b.car) {
      const text = seatText(b);
      if (seat.dataset.text !== text) { seat.innerHTML = text; seat.dataset.text = text; }
      place(seat, b.mesh.position.x, 2.2, b.mesh.position.z);
    }
    const dot = labels.dots[i];
    const colour = dotColour(i, view);
    dot.style.display = colour === null ? 'none' : '';
    if (colour !== null) { dot.style.background = COLOURS[colour].css; place(dot, g.doorX, 0.4, g.doorZ); }
  });
  blockers.forEach((x) => { if (!x.open) place(x.label, x.x, 1.5, x.z); });
  tools.forEach((t) => { if (t.plank) t.plank.rotation.z += ((t.uses ? 1.25 : 0) - t.plank.rotation.z) * Math.min(1, 1 / 10); });
  tools.forEach((t) => (t.kind === 'paint' ? place(t.label, t.at[0], 3.6, t.at[1]) : place(t.label, t.at[0] + 2.6, 0.4, t.at[1] - 2)));
  if (flipLabel) { const d = discs.find((x) => x.kind && x.kind !== 'belt'); place(flipLabel, d.x, 0.4, d.z); }
  if (clockwork) { const d = discs[clockwork.d]; place(clockwork.label, d.x + 3.6, 0.4, d.z - 2.6); }
  holes.forEach((h, i) => {
    place(h.label, h.river.hole[0] + 2.1, 0.4, h.river.hole[1] - 0.6);
    const from = holes.find((x) => routeOf(x.r) === i), text = from ? `<i>${'ABC'[from.r]}</i>` : '';
    if (h.exit.dataset.text !== text) { h.exit.innerHTML = text; h.exit.dataset.text = text; }
    place(h.exit, GEO[i].x + 2, 0.4, h.river.exit);
  });
  geo.rivers.forEach((river, r) => {
    const box = labels.blocks[r], head = geo.loop ? null : lines[r][0];
    const html = head ? `<i style="background:${COLOURS[head.c].css}">${lines[r].filter((p) => p.block === head.block).length}</i>` : '';
    if (html !== lastBlocks[r]) { box.innerHTML = html; lastBlocks[r] = html; }
    box.style.display = html ? '' : 'none';
    place(box, riverAt(r).chip[0], 0.2, riverAt(r).chip[1]);
  });
}

function update(dt) {
  const time = performance.now() / 1000;
  discs.forEach((d) => {
    const target = d.kind === 'slide' ? (d.k % 2) * d.shift : d.kind === 'carousel' ? d.k : d.k * Math.PI / 2;
    d.vel += (target - d.spin) * 220 * dt - d.vel * 18 * dt;
    d.spin += d.vel * dt;
    if (d.kind === 'points') { d.straight.visible = d.k % 2 === 0; d.crossed.visible = !d.straight.visible; }
    else if (d.kind === 'slide') {
      d.x = d.spinner.position.x = d.x0 + d.spin;
      d.stops.forEach((i) => { GEO[i].parkX = GEO[i].baseX + d.spin; GEO[i].doorX = GEO[i].baseDoor + d.spin; });
    } else if (d.kind === 'carousel') {
      d.spinner.rotation.y = -d.spin * Math.PI / 2;
      GEO.forEach((g, j) => {
        const a = (j + d.spin) * Math.PI / 2;
        g.dx = Math.sin(a);
        g.dz = -Math.cos(a);
        g.parkX = d.x + g.dx * 3.4;
        g.parkZ = d.z + g.dz * 3.4;
        g.doorX = d.x + g.dx * 6.4;
        g.doorZ = d.z + g.dz * 6.4;
        g.face = Math.atan2(-g.dx, -g.dz);
      });
    } else if (d.kind === 'belt') {
      d.spinner.rotation.y = kOf(d) ? Math.PI : 0;
      d.arrows.position.z = -((performance.now() / 1000 * 1.4) % 1.6);
    } else if (!d.kind) {
      if (d.theta !== undefined) {
        d.theta += (d.thetaT - d.theta) * Math.min(1, dt * 4);
        d.spinner.position.set(geo.ring.x + Math.cos(d.theta) * geo.ring.r, 0, geo.ring.z + Math.sin(d.theta) * geo.ring.r);
      }
      d.spinner.rotation.y = -d.spin - (d.theta === undefined ? 0 : d.theta - d.theta0);
    }
  });
  if (geo.loop) {
    const dir = kOf(discs.find((d) => d.kind === 'loop')) ? -1 : 1;
    if (phase === 'playing') beltOffset += dir * 2.4 * dt;
    const n = chevrons.count, step = loopLength() / n;
    for (let i = 0; i < n; i++) {
      const u = i * step + beltOffset, [x, z] = loopPoint(u, 0), [nx, nz] = loopPoint(u + dir * 0.1, 0);
      scratch.position.set(x, 0.2, z);
      scratch.rotation.set(0, Math.atan2(nx - x, nz - z), 0);
      scratch.scale.setScalar(1);
      scratch.updateMatrix();
      chevrons.setMatrixAt(i, scratch.matrix);
    }
    chevrons.instanceMatrix.needsUpdate = true;
  }
  if (phase === 'playing' && clockwork && !clockwork.frozen) {
    clockwork.t += dt;
    if (clockwork.t >= level.clock.period) { clockwork.t = 0; discs[clockwork.d].k++; discs[clockwork.d].vel += 9; tone(150, 0.1, 0.1); }
  }
  if (phase === 'countdown') {
    const before = Math.ceil(countdown);
    countdown -= dt;
    const shown = Math.ceil(countdown);
    if (countdown <= 0) {
      phase = 'playing';
      el('count3').textContent = 'Go!';
      tone(784, 0.3, 0.2);
      if (level.hint) { levelHintOn = true; hint(level.hint, true); }
      setTimeout(() => { if (el('count3').textContent === 'Go!') el('count3').textContent = ''; }, 500);
    } else if (shown !== before || el('count3').textContent === '') {
      el('count3').textContent = shown;
      tone(392, 0.16, 0.16);
    }
  }
  if (phase === 'playing' && level.survival) {
    const before = Math.ceil(timeLeft);
    timeLeft -= dt;
    refill -= dt;
    if (refill <= 0) { refill = 0.5; keepFull(); }
    if (Math.ceil(timeLeft) !== before) { el('clock').textContent = `⏱ ${minutes(Math.max(0, Math.ceil(timeLeft)))}`; el('clock').classList.toggle('late', timeLeft < 10); }
    if (timeLeft <= 0) finish(true);
  }
  if (phase === 'playing') {
    releaseFlow(dt);
    if (level.par) {
      const before = Math.floor(clock);
      clock += dt;
      if (Math.floor(clock) !== before || !el('clock').textContent) {
        el('clock').textContent = `⏱ ${minutes(clock)} / ${minutes(level.par)}`;
        el('clock').classList.toggle('late', clock > level.par);
      }
    }
  }
  drawPeople(dt, time);
  drawBuses(dt, time);
  drawLot(dt, time);
  drawPops(dt);
  updateLabels();
  if (phase === 'playing' && !level.survival && isJammed()) finish(false);
  if (phase === 'playing' && level.moves && taps >= level.moves && !runners && sinceFlow > 1.2 && stops.every((st) => !st.bus || st.bus.parked) && !lines.some((l) => l.some((p) => p.walk))) finish(false, 'Out of taps. Plan the order before you tap.');
  shake = Math.max(0, shake - dt * 1.6);
  camera.position.copy(camera.userData.base);
  camera.position.x += (Math.random() - 0.5) * shake;
  camera.position.z += (Math.random() - 0.5) * shake;
  camera.lookAt(camera.userData.look);
}

function resize() {
  const aspect = innerWidth / innerHeight, tan = Math.tan(THREE.MathUtils.degToRad(14));
  const distance = Math.max(((geo && geo.width) || 21) / (2 * tan * aspect), 47 / (2 * tan));
  camera.userData.look = new THREE.Vector3(0, 0, geo && geo.look !== undefined ? geo.look : -6.5);
  camera.userData.base = new THREE.Vector3(0, 0.95, 0.31).normalize().multiplyScalar(distance).add(camera.userData.look);
  camera.aspect = aspect;
  FAR = Math.min(30, tan * distance * aspect + 3);
  titleBottom = el('top').getBoundingClientRect().bottom;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function play(i) {
  el('menu').style.display = 'none';
  el('end').style.display = 'none';
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  levelHintOn = false;
  el('count3').textContent = '';
  stops.forEach((s) => { if (s.bus) world.remove(s.bus.mesh); });
  stops = [];
  flying = [];
  loadLevel(i);
  phase = 'countdown';
  countdown = 3;
  reset();
}
function openMenu() {
  phase = 'menu';
  el('end').style.display = 'none';
  hint('');
  levelHintOn = false;
  renderMenu();
  el('menu').style.display = 'flex';
}
const TEST_MODE = new URLSearchParams(location.search).has('test');
function renderMenu() {
  const stars = loadStars();
  el('tiles').innerHTML = LEVELS.map((lv, i) => {
    if (!TEST_MODE && !lv.lab && i > 0 && !stars[i - 1]) return `<button class="tile" disabled><b>${i + 1}</b>${icon('lock')}</button>`;
    return `<button class="tile" data-level="${i}"><b>${lv.lab ? 'Lab' : i + 1}</b>${lv.name}<small>${'★'.repeat(stars[i] || 0).padEnd(3, '☆')}</small></button>`;
  }).join('');
}

const raycaster = new THREE.Raycaster(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
renderer.domElement.addEventListener('pointerdown', (e) => {
  raycaster.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: 1 - e.clientY / innerHeight * 2 }, camera);
  const point = raycaster.ray.intersectPlane(floorPlane, new THREE.Vector3());
  if (!point) return;
  for (let l = 0; l < depot.length; l++) {
    const front = depot[l][0];
    if (!front) continue;
    const p = front.mesh.position;
    if (Math.abs(point.x - p.x) < 1.8 && Math.abs(point.z - p.z) < 2) { if (phase === 'playing') callLane(l); return; }
    if (Math.abs(point.x - p.x) < 1.8 && point.z < p.z && depot[l].length > 1) { hint('Only the front bus can leave'); tone(90, 0.15, 0.2); return; }
  }
  if (level.survival && phase === 'playing') {
    const stop = stops.find((st) => st.bus && st.bus.parked && Math.hypot(point.x - st.bus.mesh.position.x, point.z - st.bus.mesh.position.z) < 2.2);
    if (stop) { if (stop.bus.claimed === stop.bus.fill) { sendOff(stop); combo = 0; showCombo(); } return; }
  }
  const tool = tools.findIndex((t) => Math.hypot(point.x - t.at[0], point.z - t.at[1]) < 1.8);
  if (tool >= 0) { useTool(tool); return; }
  const near = discs.map((d, i) => [d.hit ? (d.hit(point) ? 0 : Infinity) : Math.hypot(point.x - d.x, point.z - d.z), i]).filter(([gap, i]) => gap < (discs[i].reach || 4.6)).sort((a, b) => a[0] - b[0])[0];
  if (near) twist(near[1]);
});
el('tiles').addEventListener('click', (e) => {
  const tile = e.target.closest('.tile');
  if (tile && !tile.disabled) play(+tile.dataset.level);
});
addEventListener('resize', resize);
el('restart').onclick = () => { if (phase === 'playing' || phase === 'countdown') play(levelIndex); };
el('levels').onclick = openMenu;

let last = performance.now();
function frame(now) {
  update(Math.min((now - last) / 1000, 0.05));
  last = now;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize();
const loader = new THREE.GLTFLoader();
Promise.all([loader.loadAsync('assets/bus.glb?v=2'), loader.loadAsync('assets/props.glb?v=4')]).then(([bus, propFile]) => {
  props = propFile.scene;
  busScene = bus.scene;

  const white = new THREE.Color(0xFFFFFF);
  bodies.geometry = coloured(props.getObjectByName('person_body').geometry, white);
  heads.geometry = coloured(props.getObjectByName('person_head').geometry, white);
  bodies.material.vertexColors = heads.material.vertexColors = true;
  loadLevel(0);
  phase = 'menu';
  reset();
  renderMenu();
  requestAnimationFrame(frame);
});
</script>
</body>
