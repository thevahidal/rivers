function roundedBox(w, h, d, r) {
  const x = w / 2 - r, z = d / 2 - r;
  const shape = new THREE.Shape();
  shape.moveTo(-x, -z - r);
  shape.lineTo(x, -z - r);
  shape.absarc(x, -z, r, -Math.PI / 2, 0);
  shape.lineTo(x + r, z);
  shape.absarc(x, z, r, 0, Math.PI / 2);
  shape.lineTo(-x, z + r);
  shape.absarc(-x, z, r, Math.PI / 2, Math.PI);
  shape.lineTo(-x - r, -z);
  shape.absarc(-x, -z, r, Math.PI, Math.PI * 1.5);
  const bevel = Math.min(r * 0.6, h * 0.3);
  const geometry = new THREE.ExtrudeGeometry(shape, { depth: h - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.5, bevelSegments: 5, curveSegments: 10 });
  geometry.rotateX(-Math.PI / 2);
  geometry.translate(0, bevel - h / 2, 0);
  return geometry;
}

  shape.absarc(x, -z, r, Math.PI * 1.5, Math.PI * 2);

}

function coloured(geometry, color) {
  const g = geometry.index ? geometry.toNonIndexed() : geometry.clone();

  for (let i = 0; i < n; i++) {
    const shade = ao ? 0.45 + 0.55 * Math.min(1, ao.getX(i) / max) : 1;
    rgb[i * 3] = color.r * shade;
    rgb[i * 3 + 1] = color.g * shade;
    rgb[i * 3 + 2] = color.b * shade;

}

  if (!b || phase !== 'playing') return;
  if (picked === lane) { picked = null; return; }
  if (isLocked(b)) { picked = null; hint(`Locked until bus ${letters[b.key]} leaves`); tone(90, 0.15, 0.2); return; }
  const options = allowedStops(snapshot(), seatsOf(b), CFG);
  if (!options.length) {
    picked = null;
    hint(stops.some((st) => !st.bus) ? 'This bus needs another stop' : 'All stops are taken');
    tone(90, 0.15, 0.2);
    return;
  }
  clearLevelHint();
  const feeding = options.filter((i) => lines.some((line, r) => line[0] && line[0].c === b.c && routeOf(r) === i));
  const go = options.length === 1 ? options[0] : feeding.length === 1 ? feeding[0] : null;
  if (go !== null) { sendBus(lane, go); return; }
  picked = lane;
  tone(260, 0.08, 0.08);
}
function dotColour(i, view) {
  if (stops[i].bus || phase !== 'playing' || closedBy(i)) return null;
  const from = lines.findIndex((line, r) => line[0] && (layout.discs ? routeStop(r, view, CFG) === i : layout.reach[r].includes(i)));
  return from < 0 ? null : lines[from][0].c;
}
function tapDot(i) {
  if (phase !== 'playing' || stops[i].bus) return;
  const closed = closedBy(i);
  if (closed) { hint(`Closed until bus ${letters[closed[1]]} leaves`); tone(90, 0.15, 0.2); return; }
  const now = snapshot();
  if (picked !== null) {
    if (allowedStops(now, seatsOf(depot[picked][0]), CFG).includes(i)) sendBus(picked, i);
    return;
  }
  const colour = dotColour(i, routeView());
  const lane = depot.findIndex((l) => l[0] && !isLocked(l[0]) && l[0].c === colour && allowedStops(now, seatsOf(l[0]), CFG).includes(i));
  if (lane < 0) {
    hint('No matching bus at the front');
    tone(90, 0.15, 0.2);
    return;
  }
  clearLevelHint();
  sendBus(lane, i);
}
function sendBus(lane, i) {
  picked = null;
  if (!levelHintOn) hint('');
  const b = depot[lane].shift();
  b.label.remove();
  const g = GEO[i], from = [b.mesh.position.x, b.mesh.position.z];
  const side = g.dx || 1;
  const path = g.dz < 0
    ? roundCorners([from, [from[0], AISLE], [0, AISLE], [g.parkX, g.parkZ]])
    : roundCorners([from, [from[0], AISLE], [side * FAR, AISLE]]).concat([[g.x + g.dx * FAR, g.z + g.dz * FAR_Z, true], [g.parkX, g.parkZ]]);
  stops[i].bus = { id: b.id, mesh: b.mesh, c: b.c, c2: b.c2, first: b.n * UNIT, seats: (b.n + (b.n2 || 0)) * UNIT, claimed: 0, fill: 0, parked: false, squash: 0, path, size: FRONT_SCALE, face: 0, speed: 0 };
  tone(330, 0.1, 0.1);
}
function parkNow(i) {
  const g = GEO[i], b = stops[i].bus;
  b.mesh.position.set(g.parkX, 0.1, g.parkZ);
  b.parked = true;
  b.path = [];
}
function clearLevelHint() { if (levelHintOn) { levelHintOn = false; hint(''); } }
function hint(text, sticky) {
  el('hint').textContent = text;
  el('hint').style.display = text ? '' : 'none';
  clearTimeout(hintTimer);
  if (text && !sticky) hintTimer = setTimeout(() => hint(levelHintOn ? level.hint : '', levelHintOn), 1500);
}
const minutes = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
function updateLeft() { el('left').textContent = `${TOTAL - boarded} left`; }

function twist(index) {
  if (phase !== 'playing') return;
  const lock = lockedBy(index);
  if (lock) { hint(`The bridge opens when bus ${letters[lock[1]]} leaves`); tone(90, 0.15, 0.2); return; }
  clearLevelHint();
  discs[index].k++;
  discs[index].vel += 9;
  tone(190, 0.14, 0.13);
}
function showCombo() {
  const node = el('combo');
  if (combo < 2) { node.style.opacity = 0; return; }
  node.textContent = `Combo ×${combo}`;
  node.style.opacity = 1;
  node.classList.remove('pop');
  void node.offsetWidth;
  node.classList.add('pop');
}
function releaseFlow(dt) {
  let moved = false;
  lines.forEach((line, r) => {
    acc[r] = Math.min(acc[r] + dt * RATE, 3);
    while (acc[r] >= 1) {
      const head = line[0];
      if (!head || head.s > GATE + 1) break;
      const i = routeOf(r), stop = i === null ? null : stops[i];
      if (!stop || !wants(stop, head.c)) { acc[r] = 0; break; }
      acc[r] -= 1;
      line.shift();
      stop.bus.claimed++;
      head.state = 'run';
      head.stop = stop;
      head.path = buildPath(head, i);
      head.u = 0;
      runners++;
      moved = true;
    }
  });
  if (moved || stops.some((st) => st.bus && !st.bus.parked)) sinceFlow = 0;
  else {
    sinceFlow += dt;
    if (sinceFlow > STALL && combo > 0) { combo = 0; showCombo(); }
  }
}
function board(p) {
  const stop = p.stop, b = stop.bus;
  p.state = 'gone';
  runners--;
  boarded++;
  sinceFlow = 0;
  b.fill++;
  b.squash = 1;
  updateLeft();
  if (performance.now() - lastTick > 45) { lastTick = performance.now(); tone(380 + b.fill * 6, 0.07, 0.05); }
  if (b.fill === b.seats) sendOff(stop);
}
function sendOff(stop) {
  const b = stop.bus, i = stops.indexOf(stop), g = GEO[i], m = b.mesh.position;
  burst(m.x, 2, m.z, 0xFFC233, 20);
  const path = g.dz < 0 ? roundCorners([[m.x, m.z], [0, AISLE], [FAR, AISLE]]) : [[g.x + g.dx * FAR, g.z + g.dz * FAR_Z]];
  flying.push({ mesh: b.mesh, path, speed: 0, face: b.face });
  stop.bus = null;
  gone.push(b.id);
  refreshLabels();
  combo++;
  bestCombo = Math.max(bestCombo, combo);
  showCombo();
  shake = Math.max(shake, 0.3);
  const lift = Math.min(combo, 8) * 45;
  [523, 659, 784].forEach((f, n) => setTimeout(() => tone(f + lift, 0.2, 0.12), n * 70));
  if (boarded === TOTAL) {
    phase = 'done';
    setTimeout(() => finish(true), 900);
  }
}

const loadStars = () => { try { return JSON.parse(localStorage.getItem('rivers-stars') || '{}'); } catch (e) { return {}; } };
function saveStars(i, n) {
  const all = loadStars();
  if ((all[i] || 0) >= n) return;
  all[i] = n;
  try { localStorage.setItem('rivers-stars', JSON.stringify(all)); } catch (e) {}
}
function nextBuilt(i) {
  for (let n = i + 1; n < LEVELS.length; n++) if (LEVELS[n]) return n;
  return null;
}
function finish(won) {
  phase = 'over';
  picked = null;
  const buses = level.lanes.flat().length;
  const stars = level.par ? (clock <= level.par ? 3 : clock <= level.par * 1.5 ? 2 : 1) : bestCombo >= Math.ceil(buses * 0.7) ? 3 : bestCombo >= Math.ceil(buses * 0.4) ? 2 : 1;
  el('stars').textContent = won ? '★'.repeat(stars).padEnd(3, '☆') : '';
  el('endTitle').textContent = won ? 'All aboard!' : 'No way out';
  el('endText').textContent = won ? (level.par ? `${TOTAL} people home in ${minutes(clock)}. Target ${minutes(level.par)}.` : `${TOTAL} people home. Best combo ×${bestCombo}.`) : 'No crowd can reach its bus and no bus can come. Try a different bus order.';
  const next = won ? nextBuilt(levelIndex) : null;
  if (won) saveStars(levelIndex, stars);
  el('endMain').textContent = next !== null ? 'Next level' : won ? 'All levels' : 'Try again';
  el('endMain').onclick = () => (next !== null ? play(next) : won ? openMenu() : play(levelIndex));
  el('endAlt').textContent = won ? 'Play again' : 'All levels';
  el('endAlt').onclick = () => (won ? play(levelIndex) : openMenu());
  el('end').style.display = 'flex';
  tone(won ? 784 : 120, 0.4, 0.2);
}
function isJammed() {
  if (runners > 0 || stops.some((st) => st.bus && !st.bus.parked)) return false;
  if (!lines.some((line) => line.length)) return false;
  if (flowMoves(snapshot(), CFG).some((m) => m[0] === 'call')) return false;
  for (let mask = 0; mask < (1 << discs.length); mask++) {
    const k = discs.map((disc, d) => (lockedBy(d) ? disc.k % 2 : (mask >> d) & 1)), view = routeView(k);
    for (let r = 0; r < lines.length; r++) {
      const head = lines[r][0];
      if (head && wants(stops[routeStop(r, view, CFG)], head.c)) return false;
    }
  }
  return true;
}

function drawPeople(dt, time) {
  lines.forEach((line) => layoutLine(line));
  people.forEach((p) => {
    let x, z, y = 0.39, scale = 1;
    if (p.state === 'gone') { scale = 0; x = z = 0; }
    else if (p.state === 'line') {
      p.s = p.s === p.target ? p.s : Math.max(p.target, p.s - (phase === 'playing' ? WALK * dt : 0));
      [x, z] = linePos(p);
      y += Math.abs(Math.sin(time * 9 + p.bob)) * 0.05;
    } else if (p.state === 'run') {
      p.u += RUN * dt;
      [x, z] = sample(p.path, p.u);
      p.x = x; p.z = z;
      y += Math.abs(Math.sin(time * 15 + p.bob)) * 0.16;
      if (p.u >= p.path.total) { p.state = 'hop'; p.hop = 0; p.hx = x; p.hz = z; }
    } else {
      p.hop += dt * 5;
      const t = Math.min(1, p.hop), m = p.stop.bus.mesh.position;
      x = p.hx + (m.x - p.hx) * t;
      z = p.hz + (m.z - p.hz) * t;
      y = 0.39 + Math.sin(t * Math.PI) * 1.1;
      scale = 1 - t * 0.6;
      if (t === 1) { board(p); scale = 0; }
    }
    scratch.position.set(x, y, z);
    scratch.rotation.set(0, 0, 0);
    scratch.scale.setScalar(scale);
    scratch.updateMatrix();
    bodies.setMatrixAt(p.id, scratch.matrix);
    scratch.position.y = y + 0.33 * scale;
    scratch.updateMatrix();
    heads.setMatrixAt(p.id, scratch.matrix);
  });
  bodies.instanceMatrix.needsUpdate = heads.instanceMatrix.needsUpdate = true;
}

function drawBuses(dt, time) {
  stops.forEach((stop, i) => {
    const b = stop.bus, g = GEO[i];
    if (!b) return;
    if (!b.parked) {
      b.mesh.position.y = 0.1;
      if (stepAlong(b, dt, true)) { parkNow(i); b.squash = 1; }
    }
    turnToward(b.mesh, b.face, dt);
    b.size = Math.min(1, b.size + dt * 2.4);
    b.squash = Math.max(0, b.squash - dt * 7);
    const wob = Math.sin(time * 34) * b.squash * 0.05, fat = 1 + b.fill / b.seats * 0.08;
    b.mesh.scale.set(b.size * (fat + wob), b.size * fat * (1 - wob), b.size * (fat + wob));
  });
  for (let i = flying.length - 1; i >= 0; i--) {
    const f = flying[i];
    const done = stepAlong(f, dt, false);
    turnToward(f.mesh, f.face, dt);
    if (done) { world.remove(f.mesh); flying.splice(i, 1); }
  }
}
function drawLot(dt, time) {
  const canLeave = phase === 'playing' && stops.some((s) => !s.bus);
  depot.forEach((lane, l) => lane.forEach((b, j) => {
    const m = b.mesh.position, chosen = picked === l && j === 0;
    const hop = chosen ? 0.5 + Math.abs(Math.sin(time * 10)) * 0.5 : j === 0 && canLeave && !isLocked(b) ? Math.abs(Math.sin(time * 6)) * 0.35 : 0;
    m.z += (LOT_FRONT - j * LOT_PITCH - m.z) * Math.min(1, dt * 10);
    m.y = 0.1 + hop;
    const size = b.mesh.scale.x + ((j === 0 ? FRONT_SCALE : LOT_SCALE) - b.mesh.scale.x) * Math.min(1, dt * 10);
    b.mesh.scale.setScalar(size);
    b.label.classList.toggle('front', j === 0);
    place(b.label, m.x, 2 * size + hop, m.z);
  }));
}
function drawPops(dt) {
  const m = new THREE.Matrix4();
  popBits.forEach((b, i) => {
    if (b.life <= 0) return;
    b.life -= dt;
    b.vy -= dt * 20;
    b.x += b.vx * dt;
    b.y = Math.max(0.2, b.y + b.vy * dt);
    b.z += b.vz * dt;
    pops.setMatrixAt(i, b.life <= 0 ? m.makeScale(0, 0, 0) : m.makeTranslation(b.x, b.y, b.z));
  });
  pops.instanceMatrix.needsUpdate = true;
}
function updateLabels() {
  if (!labels.seats) return;
  let options = [];
  if (picked !== null && phase === 'playing') {
    options = allowedStops(snapshot(), seatsOf(depot[picked][0]), CFG);
    if (!options.length) picked = null;
  }
  GEO.forEach((g, i) => {
    const show = picked !== null && options.includes(i);
    labels.here[i].style.display = show ? '' : 'none';
    if (show) place(labels.here[i], g.parkX, 0.3, g.parkZ);
  });
  const view = routeView();
  stops.forEach((stop, i) => {
    const seat = labels.seats[i], b = stop.bus, g = GEO[i];
    seat.style.display = b && b.parked ? '' : 'none';
    if (b && b.parked) {
      const top = b.c2 === undefined ? '' : COLOURS[b.c2].css;
      const text = !top ? String(b.seats - b.fill) : b.fill < b.first ? `${b.first - b.fill}<span style="color:${top}">+${b.seats - b.first}</span>` : `<span style="color:${top}">${b.seats - b.fill}</span>`;
      if (seat.dataset.text !== text) { seat.innerHTML = text; seat.dataset.text = text; }
      place(seat, b.mesh.position.x, 2.2, b.mesh.position.z);
    }
    const dot = labels.dots[i];
    const colour = dotColour(i, view);
    dot.style.display = colour === null ? 'none' : '';
    if (colour !== null) { dot.style.background = COLOURS[colour].css; place(dot, g.doorX, 0.4, g.doorZ); }
  });
  blockers.forEach((x) => { if (!x.open) place(x.label, x.x, 1.5, x.z); });
  geo.rivers.forEach((river, r) => {
    const box = labels.blocks[r], head = lines[r][0];
    const html = head ? `<i style="background:${COLOURS[head.c].css}">${lines[r].filter((p) => p.block === head.block).length}</i>` : '';
    if (html !== lastBlocks[r]) { box.innerHTML = html; lastBlocks[r] = html; }
    box.style.display = html ? '' : 'none';
    place(box, river.chip[0], 0.2, river.chip[1]);
  });
}

function update(dt) {
  const time = performance.now() / 1000;
  discs.forEach((d) => {
    d.vel += (d.k * Math.PI / 2 - d.spin) * 220 * dt - d.vel * 18 * dt;
    d.spin += d.vel * dt;
    d.spinner.rotation.y = -d.spin;
  });
  if (phase === 'countdown') {
    const before = Math.ceil(countdown);
    countdown -= dt;
    const shown = Math.ceil(countdown);
    if (countdown <= 0) {
      phase = 'playing';
      el('count3').textContent = 'Go!';
      tone(784, 0.3, 0.2);
      if (level.hint) { levelHintOn = true; hint(level.hint, true); }
      setTimeout(() => { if (el('count3').textContent === 'Go!') el('count3').textContent = ''; }, 500);
    } else if (shown !== before || el('count3').textContent === '') {
      el('count3').textContent = shown;
      tone(392, 0.16, 0.16);
    }
  }
  if (phase === 'playing') {
    releaseFlow(dt);
    if (level.par) {
      const before = Math.floor(clock);
      clock += dt;
      if (Math.floor(clock) !== before || !el('clock').textContent) {
        el('clock').textContent = `⏱ ${minutes(clock)} / ${minutes(level.par)}`;
        el('clock').classList.toggle('late', clock > level.par);
      }
    }
  }
  drawPeople(dt, time);
  drawBuses(dt, time);
  drawLot(dt, time);
  drawPops(dt);
  updateLabels();
  if (phase === 'playing' && isJammed()) finish(false);
  shake = Math.max(0, shake - dt * 1.6);
  camera.position.copy(camera.userData.base);
  camera.position.x += (Math.random() - 0.5) * shake;
  camera.position.z += (Math.random() - 0.5) * shake;
  camera.lookAt(camera.userData.look);
}

function resize() {
  const aspect = innerWidth / innerHeight, tan = Math.tan(THREE.MathUtils.degToRad(14));
  const distance = Math.max(21 / (2 * tan * aspect), 47 / (2 * tan));
  camera.userData.look = new THREE.Vector3(0, 0, geo && geo.look !== undefined ? geo.look : -6.5);
  camera.userData.base = new THREE.Vector3(0, 0.95, 0.31).normalize().multiplyScalar(distance).add(camera.userData.look);
  camera.aspect = aspect;
  FAR = Math.min(30, tan * distance * aspect + 3);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function play(i) {
  el('menu').style.display = 'none';
  el('end').style.display = 'none';
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  levelHintOn = false;
  el('count3').textContent = '';
  stops.forEach((s) => { if (s.bus) world.remove(s.bus.mesh); });
  stops = [];
  flying = [];
  loadLevel(i);
  phase = 'countdown';
  countdown = 3;
  reset();
}
function openMenu() {
  phase = 'menu';
  el('end').style.display = 'none';
  hint('');
  levelHintOn = false;
  renderMenu();
  el('menu').style.display = 'flex';
}
const TEST_MODE = new URLSearchParams(location.search).has('test');
function renderMenu() {
  const stars = loadStars();
  el('tiles').innerHTML = LEVELS.map((lv, i) => {
    if (!TEST_MODE && i > 0 && !stars[i - 1]) return `<button class="tile" disabled><b>${i + 1}</b>🔒</button>`;
    return `<button class="tile" data-level="${i}"><b>${i + 1}</b>${lv.name}<small>${'★'.repeat(stars[i] || 0).padEnd(3, '☆')}</small></button>`;
  }).join('');
}

const raycaster = new THREE.Raycaster(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
renderer.domElement.addEventListener('pointerdown', (e) => {
  raycaster.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: 1 - e.clientY / innerHeight * 2 }, camera);
  const point = raycaster.ray.intersectPlane(floorPlane, new THREE.Vector3());
  if (!point) return;
  for (let l = 0; l < depot.length; l++) {
    const front = depot[l][0];
    if (!front) continue;
    const p = front.mesh.position;
    if (Math.abs(point.x - p.x) < 1.8 && Math.abs(point.z - p.z) < 2) { if (phase === 'playing') callLane(l); return; }
    if (Math.abs(point.x - p.x) < 1.8 && point.z < p.z && depot[l].length > 1) { hint('Only the front bus can leave'); tone(90, 0.15, 0.2); return; }
  }
  discs.forEach((d, i) => { if (Math.hypot(point.x - d.x, point.z - d.z) < 4.6) twist(i); });
});
el('tiles').addEventListener('click', (e) => {
  const tile = e.target.closest('.tile');
  if (tile && !tile.disabled) play(+tile.dataset.level);
});
addEventListener('resize', resize);
el('restart').onclick = () => { if (phase === 'playing' || phase === 'countdown') play(levelIndex); };
el('levels').onclick = openMenu;

let last = performance.now();
function frame(now) {
  update(Math.min((now - last) / 1000, 0.05));
  last = now;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize();
const loader = new THREE.GLTFLoader();
Promise.all([loader.loadAsync('assets/bus.glb?v=2'), loader.loadAsync('assets/props.glb?v=2')]).then(([bus, propFile]) => {
  props = propFile.scene;
  busScene = bus.scene;

  const white = new THREE.Color(0xFFFFFF);
  bodies.geometry = coloured(props.getObjectByName('person_body').geometry, white);
  heads.geometry = coloured(props.getObjectByName('person_head').geometry, white);
  bodies.material.vertexColors = heads.material.vertexColors = true;
  loadLevel(0);
  phase = 'menu';
  reset();
  renderMenu();
  requestAnimationFrame(frame);
});
</script>
</body>
