<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Rivers: Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #BDE8C4; font-family: 'Baloo 2', system-ui, sans-serif; color: #24324A; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; touch-action: none; }
  button { font-family: inherit; cursor: pointer; }
  #top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; align-items: center; justify-content: flex-end; }
  #left { position: fixed; left: 10px; bottom: max(12px, env(safe-area-inset-bottom)); }
  .chip { padding: 4px 13px; border-radius: 18px; background: #fff; box-shadow: 0 3px 0 #A9D6B3; font-size: 18px; font-weight: 800; line-height: 1.25; white-space: nowrap; }
  .tool { height: 36px; padding: 0 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 3px 0 #A9D6B3; color: #24324A; font-size: 15px; font-weight: 800; }
  #combo { position: fixed; bottom: max(96px, calc(env(safe-area-inset-bottom) + 86px)); left: 0; right: 0; text-align: center; font-size: 42px; font-weight: 800; color: #FFC233; -webkit-text-stroke: 3px #24324A; paint-order: stroke fill; pointer-events: none; opacity: 0; }
  #combo.pop { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(.5); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
  #hint { position: fixed; bottom: max(58px, calc(env(safe-area-inset-bottom) + 48px)); left: 50%; transform: translateX(-50%); padding: 2px 13px; border-radius: 13px; background: rgba(36, 50, 74, .82); color: #fff; font-size: 15px; font-weight: 600; white-space: nowrap; pointer-events: none; }
  #count3 { position: fixed; top: 26%; left: 0; right: 0; text-align: center; font-size: 120px; font-weight: 800; color: #fff; -webkit-text-stroke: 5px #24324A; paint-order: stroke fill; pointer-events: none; }
  .seat { font-size: 13px; font-weight: 800; color: #fff; -webkit-text-stroke: 3px #24324A; paint-order: stroke fill; }
  .seat.front { font-size: 21px; }
  .pin { position: fixed; left: 0; top: 0; transform: translate(-50%, -50%); pointer-events: none; }
  .pill { width: 72px; padding: 1px 7px 6px; box-sizing: border-box; border-radius: 13px; background: #fff; box-shadow: 0 3px 0 rgba(36,50,74,.22); text-align: center; font-size: 15px; font-weight: 800; }
  .bar { height: 7px; border-radius: 4px; background: #E7ECF3; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; }
  .blocks { display: flex; flex-wrap: wrap; gap: 3px; width: 112px; }
  .blocks.right { justify-content: flex-end; }
  .blocks i { min-width: 26px; height: 22px; padding: 0 3px; box-sizing: border-box; border-radius: 7px; color: #fff; font-size: 13px; font-style: normal; font-weight: 800; text-align: center; line-height: 22px; }
  .blocks i:first-child { outline: 2px solid #fff; }
  .dot { width: 20px; height: 20px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 2px 0 rgba(36,50,74,.25); }
  .screen { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(36, 50, 74, .5); }
  .card { width: min(88vw, 350px); padding: 24px 20px; box-sizing: border-box; border-radius: 30px; background: #fff; box-shadow: 0 10px 0 #C6D2E3; text-align: center; }
  .card h1 { margin: 0; font-size: 36px; font-weight: 800; line-height: 1.1; }
  .card p { margin: 8px 0 18px; font-size: 18px; font-weight: 600; color: #6B778C; line-height: 1.25; }
  .stars { font-size: 46px; line-height: 1.1; color: #FFC233; letter-spacing: 4px; }
  .big { width: 100%; height: 58px; border: 0; border-radius: 22px; background: #4CC26E; box-shadow: 0 7px 0 #2F9450; color: #fff; font-size: 24px; font-weight: 800; }
  .big:active { transform: translateY(5px); box-shadow: 0 2px 0 #2F9450; }
</style>
</head>
<body>
<div id="top"><div class="chip" id="left"></div><button class="tool" id="restart">Restart</button></div>
<div id="combo"></div>
<div id="hint"></div>
<div id="count3"></div>
<div id="labels"></div>
<div id="start" class="screen"><div class="card"><h1>Rivers</h1><p>Tap a front bus in the lot to call it. Tap a turntable to send the crowd somewhere else. Keep the rivers pouring.</p><button id="play" class="big">Play</button></div></div>
<div id="end" class="screen" style="display:none"><div class="card"><div id="stars" class="stars"></div><h1 id="endTitle"></h1><p id="endText"></p><button id="again" class="big">Play again</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="puzzle-rules.js?v=2"></script>
<script>
const STAGE = {"rivers":[[[2,3],[3,3],[3,3],[2,3],[0,4]],[[0,3],[1,3],[2,3],[1,5],[2,3]],[[3,3],[3,3],[1,4],[0,5]]],"lanes":[[{"id":8,"c":3,"n":4},{"id":5,"c":2,"n":5},{"id":9,"c":3,"n":4},{"id":7,"c":3,"n":4},{"id":0,"c":0,"n":5}],[{"id":1,"c":0,"n":7},{"id":2,"c":1,"n":4},{"id":4,"c":1,"n":4}],[{"id":3,"c":1,"n":4},{"id":6,"c":2,"n":7}]]};
const UNIT = 10, R = 2.6, GATE = R + 0.5, LANES = 3, ROW = 0.46, GAP = 0.5, WALK = 6.5, RUN = 8.5, RATE = 36, STALL = 3;
const LOT_X = [-6, 0, 6], LOT_FRONT = -21, LOT_PITCH = 2.6, LOT_SCALE = 0.62, FRONT_SCALE = 0.86, AISLE = -18.3, DRIVE = 34;
const N = 0, E = 1, S = 2, W = 3;
const PORT = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const COLOURS = [
  { body: 0x3F86F5, dark: 0x2A5FB8, css: '#3F86F5' },
  { body: 0xFF8B2B, dark: 0xC8611A, css: '#FF8B2B' },
  { body: 0x39B97A, dark: 0x237F52, css: '#39B97A' },
  { body: 0xA05CFF, dark: 0x6F38BF, css: '#A05CFF' }
];
const DISCS = [[0, -6.4], [0, 6.4]];
const RIVERS = [{ disc: 0, port: E }, { disc: 0, port: W }, { disc: 1, port: S }];
const STOPS = [{ disc: 0, port: N }, { disc: 1, port: E }, { disc: 1, port: W }];
const TOTAL = STAGE.rivers.flat().reduce((sum, block) => sum + block[1] * UNIT, 0);
const CFG = { bridge: true };
const otherEnd = (local) => (local < 2 ? 1 - local : 5 - local);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xBDE8C4);
const camera = new THREE.PerspectiveCamera(28, 1, 1, 260);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xA8D8B4, 0.5));
const sun = new THREE.DirectionalLight(0xFFF3DE, 0.5);
sun.position.set(-7, 24, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 6;
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 26, bottom: -26, far: 80 });
scene.add(sun);

const paint = (color, roughness = 0.6) => new THREE.MeshStandardMaterial({ color, roughness });
function roundedBox(w, h, d, r) {
  const x = w / 2 - r, z = d / 2 - r;
  const shape = new THREE.Shape();
  shape.moveTo(-x, -z - r);
  shape.lineTo(x, -z - r);
  shape.absarc(x, -z, r, -Math.PI / 2, 0);
  shape.lineTo(x + r, z);
  shape.absarc(x, z, r, 0, Math.PI / 2);
  shape.lineTo(-x, z + r);
  shape.absarc(-x, z, r, Math.PI / 2, Math.PI);
  shape.lineTo(-x - r, -z);
  shape.absarc(-x, -z, r, Math.PI, Math.PI * 1.5);
  const bevel = Math.min(r * 0.6, h * 0.3);
  const geometry = new THREE.ExtrudeGeometry(shape, { depth: h - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.5, bevelSegments: 5, curveSegments: 10 });
  geometry.rotateX(-Math.PI / 2);
  geometry.translate(0, bevel - h / 2, 0);
  return geometry;
}
function part(geometry, material, x, y, z, shadow = true) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = shadow;
  mesh.receiveShadow = true;
  return mesh;
}
scene.add(part(new THREE.BoxGeometry(140, 0.1, 140), paint(0xBDE8C4, 0.95), 0, -0.05, 0, false));
const roadPaint = paint(0x5C6B82, 0.85), kerb = paint(0xF5F1E6, 0.8);
function addRoad(cx, cz, w, d) {
  scene.add(part(new THREE.BoxGeometry(w + 0.34, 0.08, d + 0.34), kerb, cx, 0.04, cz, false));
  scene.add(part(new THREE.BoxGeometry(w, 0.1, d), roadPaint, cx, 0.06, cz, false));
}
addRoad(0, 0, 2.5, 7.2);
addRoad(24, -6.4, 42, 2.5);
addRoad(-24, -6.4, 42, 2.5);
addRoad(0, 28, 2.5, 38);
addRoad(0, -14, 2.5, 9);
addRoad(8, 6.4, 9.5, 2.5);
addRoad(-8, 6.4, 9.5, 2.5);
addRoad(0, AISLE, 36, 2.5);
scene.add(part(new THREE.BoxGeometry(22, 0.06, 15), paint(0xD9DFD6, 0.9), 0, 0.03, -27.2, false));
[-3, 3].forEach((x) => scene.add(part(new THREE.BoxGeometry(0.14, 0.05, 15), paint(0xFFFFFF, 0.8), x, 0.08, -27.2, false)));

const arcPaint = new THREE.MeshStandardMaterial({ color: 0x5C6B82, roughness: 0.85, side: THREE.DoubleSide });
const discs = DISCS.map(([x, z]) => {
  scene.add(part(new THREE.CylinderGeometry(3.32, 3.42, 0.3, 72), kerb, x, 0.15, z));
  const spinner = new THREE.Group();
  spinner.position.set(x, 0, z);
  scene.add(spinner);
  spinner.add(part(new THREE.CylinderGeometry(3.05, 3.05, 0.16, 72), paint(0xFFFFFF, 0.5), 0, 0.36, 0));
  [[R, -R, Math.PI], [-R, R, 0]].forEach(([ax, az, start]) => {
    const arc = new THREE.Mesh(new THREE.RingGeometry(R - 1.15, R + 1.15, 48, 1, start, Math.PI / 2), arcPaint);
    arc.rotation.x = -Math.PI / 2;
    arc.position.set(ax, 0.45, az);
    spinner.add(arc);
  });
  spinner.add(part(new THREE.CylinderGeometry(0.42, 0.5, 0.26, 28), paint(0xFFC233, 0.4), 0, 0.56, 0));
  return { x, z, spinner, k: 0, spin: 0, vel: 0 };
});

const leaf = [paint(0x5BBF6A, 0.8), paint(0x46A95A, 0.8)], trunk = paint(0xB0805A, 0.85);
function tree(x, z, s) {
  const group = new THREE.Group();
  group.add(part(new THREE.CylinderGeometry(0.16, 0.22, 0.8, 10), trunk, 0, 0.4, 0));
  group.add(part(new THREE.IcosahedronGeometry(0.8, 2), leaf[Math.floor(Math.abs(x * 3)) % 2], 0, 1.3, 0));
  group.position.set(x, 0, z);
  group.scale.setScalar(s);
  scene.add(group);
}
[[-5, -13, 1.1], [-7.5, -15.5, 1.3], [5.2, -12.6, 1], [7.4, -15.8, 1.2], [-5.5, 1.6, 1.2], [-8.4, 0.2, 1], [6, 1.2, 1.1], [8.6, 0.4, 1.2], [-5.6, 13.6, 1.2], [-8.4, 15, 1], [5.4, 14, 1.1], [8.4, 15.2, 1.2]].forEach(([x, z, s]) => tree(x, z, s));

const GEO = STOPS.map((s) => {
  const [dx, dz] = PORT[s.port], [x, z] = DISCS[s.disc];
  return { dx, dz, x, z, doorX: x + dx * (R + 2.15), doorZ: z + dz * (R + 2.15), parkX: x + dx * (R + 3.3), parkZ: z + dz * (R + 3.3) };
});

function makeBus(c) {
  const col = COLOURS[c], group = new THREE.Group();
  const glass = paint(0x21304A, 0.2), tyre = paint(0x2A3040, 0.75);
  group.add(part(roundedBox(2.05, 0.46, 3.7, 0.3), paint(col.dark, 0.5), 0, 0.42, 0));
  group.add(part(roundedBox(1.95, 1.12, 3.6, 0.36), paint(col.body, 0.42), 0, 1.14, 0));
  group.add(part(roundedBox(1.72, 0.14, 3.2, 0.2), paint(new THREE.Color(col.body).lerp(new THREE.Color(0xFFFFFF), 0.4).getHex(), 0.4), 0, 1.78, 0, false));
  [1, -1].forEach((side) => {
    group.add(part(roundedBox(0.05, 0.42, 3, 0.02), glass, side * 0.985, 1.26, 0, false));
    [-1.08, 1.08].forEach((z) => {
      const wheel = part(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 20), tyre, side * 0.98, 0.3, z);
      wheel.rotation.z = Math.PI / 2;
      group.add(wheel);
    });
  });
  return group;
}

const bodies = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.16, 0.21, 0.4, 10), new THREE.MeshStandardMaterial({ roughness: 0.5 }), TOTAL);
const heads = new THREE.InstancedMesh(new THREE.SphereGeometry(0.165, 12, 10), new THREE.MeshStandardMaterial({ roughness: 0.55 }), TOTAL);
bodies.castShadow = heads.castShadow = true;
bodies.frustumCulled = heads.frustumCulled = false;
scene.add(bodies, heads);

const POPS = 90;
const pops = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.15, 1), new THREE.MeshBasicMaterial(), POPS);
pops.frustumCulled = false;
scene.add(pops);
const popBits = Array.from({ length: POPS }, (_, i) => { pops.setMatrixAt(i, new THREE.Matrix4().makeScale(0, 0, 0)); pops.setColorAt(i, new THREE.Color(0xffffff)); return { life: 0, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 }; });
let nextPop = 0;

const el = (id) => document.getElementById(id);
const scratch = new THREE.Object3D(), paintColor = new THREE.Color();
let audio, phase = 'menu', countdown = 0, people = [], lines = [[], [], []], acc = [0, 0, 0], stops = [], depot = [], flying = [];
let boarded = 0, runners = 0, shake = 0, combo = 0, bestCombo = 0, sinceFlow = 0, labels = {}, lastBlocks = ['', '', ''], lastTick = 0, lastSig = '';

function tone(freq, length, volume) {
  if (!audio) return;
  const osc = audio.createOscillator(), gain = audio.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + length);
  osc.connect(gain).connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + length);
}
function burst(x, y, z, hex, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, power = 2 + Math.random() * 5;
    Object.assign(popBits[nextPop], { life: 0.7 + Math.random() * 0.4, x, y, z, vx: Math.cos(a) * power, vy: 5 + Math.random() * 6, vz: Math.sin(a) * power });
    pops.setColorAt(nextPop, paintColor.setHex(hex));
    nextPop = (nextPop + 1) % POPS;
  }
  pops.instanceColor.needsUpdate = true;
}
function pin(cls, html) {
  const node = document.createElement('div');
  node.className = 'pin ' + cls;
  node.innerHTML = html;
  el('labels').append(node);
  return node;
}
function place(node, x, y, z) {
  const p = new THREE.Vector3(x, y, z).project(camera);
  node.style.left = (p.x + 1) / 2 * innerWidth + 'px';
  node.style.top = (1 - p.y) / 2 * innerHeight + 'px';
}

const routeState = () => ({ k: discs.map((d) => d.k % 2) });
const routeOf = (r) => routeStop(r, routeState(), CFG);
const wants = (stop, c) => !!stop.bus && stop.bus.parked && stop.bus.c === c && stop.bus.claimed < stop.bus.seats;

function reset() {
  flying.forEach((f) => scene.remove(f.mesh));
  flying = [];
  stops.forEach((s) => { if (s.bus) scene.remove(s.bus.mesh); });
  stops = STOPS.map(() => ({ bus: null }));
  discs.forEach((d) => { d.k = 0; d.spin = 0; d.vel = 0; d.spinner.rotation.y = 0; });
  depot.flat().forEach((b) => scene.remove(b.mesh));
  depot = STAGE.lanes.map((lane, l) => lane.map((b, j) => {
    const mesh = makeBus(b.c);
    mesh.position.set(LOT_X[l], 0.1, LOT_FRONT - j * LOT_PITCH);
    mesh.scale.setScalar(LOT_SCALE);
    scene.add(mesh);
    return { ...b, mesh };
  }));
  boarded = runners = combo = bestCombo = sinceFlow = 0;
  lastSig = '';
  acc = [0, 0, 0];
  lastBlocks = ['', '', ''];
  people = [];
  lines = [[], [], []];
  let id = 0;
  STAGE.rivers.forEach((river, r) => river.forEach(([c, n], block) => {
    for (let i = 0; i < n * UNIT; i++) {
      const p = { id, c, river: r, block, lane: i % LANES, state: 'line', s: 0, target: 0, x: 0, z: 0, bob: Math.random() * 6.28, u: 0, path: null, stop: null, hop: 0 };
      people.push(p);
      lines[r].push(p);
      bodies.setColorAt(id, paintColor.setHex(COLOURS[c].dark));
      heads.setColorAt(id, paintColor.setHex(COLOURS[c].body));
      id++;
    }
  }));
  bodies.instanceColor.needsUpdate = heads.instanceColor.needsUpdate = true;
  lines.forEach((line) => layoutLine(line, true));
  el('labels').innerHTML = '';
  labels = {
    pills: STOPS.map(() => pin('pill', '<span></span><div class="bar"><i></i></div>')),
    dots: STOPS.map(() => pin('dot', '')),
    blocks: RIVERS.map((_, r) => pin('blocks' + (r === 1 ? ' right' : ''), ''))
  };
  depot.flat().forEach((b) => { b.label = pin('seat', b.n * UNIT); });
  el('combo').style.opacity = 0;
  hint('');
  [0, 1, 2].forEach(callLane);
  stops.forEach((s, i) => { if (s.bus) parkNow(i, true); });
  updateLeft();
}

function layoutLine(line, instant) {
  const count = [0, 0, 0];
  let lastBlock = null, offset = 0;
  line.forEach((p) => {
    if (lastBlock !== null && p.block !== lastBlock) offset += GAP;
    lastBlock = p.block;
    p.target = GATE + 0.25 + count[p.lane] * ROW + offset;
    count[p.lane]++;
    if (instant) p.s = p.target;
  });
}
function linePos(p) {
  const river = RIVERS[p.river], [dx, dz] = PORT[river.port], [ox, oz] = DISCS[river.disc], lat = (p.lane - 1) * 0.66;
  return [ox + dx * p.s + (dz ? lat : 0), oz + dz * p.s + (dx ? lat : 0)];
}
function buildPath(p, stopIndex) {
  const g = GEO[stopIndex], lat = (p.lane - 1) * 0.66, points = [linePos(p)];
  let disc = RIVERS[p.river].disc, port = RIVERS[p.river].port;
  for (let guard = 0; guard < 2; guard++) {
    const d = discs[disc], k = d.k, local = ((port - k) % 4 + 4) % 4, out = (otherEnd(local) + k) % 4;
    const first = local % 2 === 0, turn = k * Math.PI / 2, r = R + lat;
    for (let i = 0; i <= 12; i++) {
      const t = (first ? i / 12 : 1 - i / 12) * Math.PI / 2;
      const lx = local < 2 ? R - r * Math.cos(t) : -R + r * Math.cos(t);
      const lz = local < 2 ? -R + r * Math.sin(t) : R - r * Math.sin(t);
      points.push([d.x + lx * Math.cos(turn) - lz * Math.sin(turn), d.z + lx * Math.sin(turn) + lz * Math.cos(turn)]);
    }
    if (disc === 0 && out === S) { disc = 1; port = N; } else break;
  }
  points.push([g.doorX + (g.dz ? lat * 0.3 : 0), g.doorZ + (g.dx ? lat * 0.3 : 0)]);
  const lengths = [0];
  for (let i = 1; i < points.length; i++) lengths.push(lengths[i - 1] + Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]));
  return { points, lengths, total: lengths[lengths.length - 1] };
}
function sample(path, u) {
  let i = 1;
  while (i < path.lengths.length - 1 && path.lengths[i] < u) i++;
  const span = path.lengths[i] - path.lengths[i - 1] || 1, f = Math.min(1, (u - path.lengths[i - 1]) / span);
  return [path.points[i - 1][0] + (path.points[i][0] - path.points[i - 1][0]) * f, path.points[i - 1][1] + (path.points[i][1] - path.points[i - 1][1]) * f];
}

function snapshot() {
  const rivers = lines.map((line) => {
    const blocks = [];
    let lastBlock = null;
    line.forEach((p) => {
      if (p.block !== lastBlock) blocks.push([p.c, 0]);
      blocks[blocks.length - 1][1]++;
      lastBlock = p.block;
    });
    return blocks;
  });
  return {
    rivers,
    lanes: depot.map((lane) => lane.map((b) => ({ id: b.id, c: b.c, n: b.n * UNIT }))),
    stops: [0, 1, 2, 3].map((i) => {
      const b = stops[i] && stops[i].bus;
      return { bus: b ? { id: b.id, c: b.c, n: b.seats, fill: b.claimed } : null, plat: [0, 0, 0, 0] };
    }),
    k: discs.map((d) => d.k % 2),
    gone: [],
    moves: 0
  };
}
function callLane(lane) {
  const bus = depot[lane][0];
  if (!bus || phase === 'over' || phase === 'done') return;
  const i = flowStop(snapshot(), { c: bus.c, n: bus.n * UNIT });
  if (i === null) { hint(stops.some((st) => !st.bus) ? 'This bus needs a side stop' : 'All stops are taken'); tone(90, 0.15, 0.2); return; }
  hint('');
  depot[lane].shift();
  bus.label.remove();
  const g = GEO[i], x0 = bus.mesh.position.x;
  const path = i === 0
    ? [[x0, AISLE], [0, AISLE], [g.parkX, g.parkZ]]
    : [[x0, AISLE], [g.dx * 15, AISLE], [g.dx * 16, g.z, true], [g.parkX, g.parkZ]];
  stops[i].bus = { id: bus.id, mesh: bus.mesh, c: bus.c, seats: bus.n * UNIT, claimed: 0, fill: 0, parked: false, squash: 0, path, size: FRONT_SCALE, face: 0 };
  tone(330, 0.1, 0.1);
}
function parkNow(i, instant) {
  const g = GEO[i], b = stops[i].bus;
  b.mesh.position.set(g.parkX, 0.1, g.parkZ);
  b.parked = true;
  b.path = [];
  if (instant) { b.size = 1; b.mesh.rotation.y = g.dz ? Math.PI / 2 : 0; }
}
let hintTimer;
function hint(text) {
  el('hint').textContent = text;
  el('hint').style.display = text ? '' : 'none';
  clearTimeout(hintTimer);
  if (text) hintTimer = setTimeout(() => hint(''), 1500);
}
function updateLeft() { el('left').textContent = `${TOTAL - boarded} left`; }

function twist(index) {
  if (phase !== 'playing') return;
  discs[index].k++;
  discs[index].vel += 9;
  tone(190, 0.14, 0.13);
}

function showCombo() {
  const node = el('combo');
  if (combo < 2) { node.style.opacity = 0; return; }
  node.textContent = `Combo ×${combo}`;
  node.style.opacity = 1;
  node.classList.remove('pop');
  void node.offsetWidth;
  node.classList.add('pop');
}

function releaseFlow(dt) {
  let moved = false;
  RIVERS.forEach((_, r) => {
    acc[r] = Math.min(acc[r] + dt * RATE, 3);
    while (acc[r] >= 1) {
      const head = lines[r][0];
      if (!head || head.s > GATE + 1) break;
      const i = routeOf(r), stop = i === null ? null : stops[i];
      if (!stop || !wants(stop, head.c)) { acc[r] = 0; break; }
      acc[r] -= 1;
      lines[r].shift();
      stop.bus.claimed++;
      head.state = 'run';
      head.stop = stop;
      head.path = buildPath(head, i);
      head.u = 0;
      runners++;
      moved = true;
    }
  });
  if (moved) sinceFlow = 0;
  else {
    sinceFlow += dt;
    if (sinceFlow > STALL && combo > 0) { combo = 0; showCombo(); }
  }
}

function board(p) {
  const stop = p.stop, b = stop.bus;
  p.state = 'gone';
  runners--;
  boarded++;
  sinceFlow = 0;
  b.fill++;
  b.squash = 1;
  updateLeft();
  if (performance.now() - lastTick > 45) { lastTick = performance.now(); tone(380 + b.fill * 6, 0.07, 0.05); }
  if (b.fill === b.seats) sendOff(stop);
}
function sendOff(stop) {
  const b = stop.bus, g = GEO[stops.indexOf(stop)];
  burst(b.mesh.position.x, 2, b.mesh.position.z, 0xFFC233, 20);
  flying.push({ mesh: b.mesh, dx: g.dx, dz: g.dz, v: -3 });
  stop.bus = null;
  combo++;
  bestCombo = Math.max(bestCombo, combo);
  showCombo();
  shake = Math.max(shake, 0.3);
  const lift = Math.min(combo, 8) * 45;
  [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f + lift, 0.2, 0.12), i * 70));
  if (boarded === TOTAL) {
    phase = 'done';
    setTimeout(() => finish(true), 900);
  }
}
function finish(won) {
  phase = 'over';
  el('stars').textContent = won ? '★'.repeat(bestCombo >= 7 ? 3 : bestCombo >= 4 ? 2 : 1).padEnd(3, '☆') : '';
  el('endTitle').textContent = won ? 'All aboard!' : 'No way out';
  el('endText').textContent = won ? `${TOTAL} people home. Best combo ×${bestCombo}.` : "This crowd can't all get home now. Try a different bus order.";
  el('end').style.display = 'flex';
  tone(won ? 784 : 120, 0.4, 0.2);
}
function isStuck() {
  if (runners > 0 || stops.some((st) => st.bus && !st.bus.parked)) return false;
  const now = snapshot(), sig = flowKey(now);
  if (sig === lastSig) return false;
  lastSig = sig;
  return !canWin(now);
}

function drawPeople(dt, time) {
  lines.forEach((line) => layoutLine(line));
  people.forEach((p) => {
    let x, z, y = 0.39, scale = 1;
    if (p.state === 'gone') { scale = 0; x = z = 0; }
    else if (p.state === 'line') {
      p.s = Math.max(p.target, p.s - (phase === 'playing' ? WALK * dt : 0));
      [x, z] = linePos(p);
      y += Math.abs(Math.sin(time * 9 + p.bob)) * 0.05;
    } else if (p.state === 'run') {
      p.u += RUN * dt;
      [x, z] = sample(p.path, p.u);
      p.x = x; p.z = z;
      y += Math.abs(Math.sin(time * 15 + p.bob)) * 0.16;
      if (p.u >= p.path.total) { p.state = 'hop'; p.hop = 0; p.hx = x; p.hz = z; }
    } else {
      p.hop += dt * 5;
      const t = Math.min(1, p.hop), m = p.stop.bus.mesh.position;
      x = p.hx + (m.x - p.hx) * t;
      z = p.hz + (m.z - p.hz) * t;
      y = 0.39 + Math.sin(t * Math.PI) * 1.1;
      scale = 1 - t * 0.6;
      if (t === 1) { board(p); scale = 0; }
    }
    scratch.position.set(x, y, z);
    scratch.rotation.set(0, 0, 0);
    scratch.scale.setScalar(scale);
    scratch.updateMatrix();
    bodies.setMatrixAt(p.id, scratch.matrix);
    scratch.position.y = y + 0.33 * scale;
    scratch.updateMatrix();
    heads.setMatrixAt(p.id, scratch.matrix);
  });
  bodies.instanceMatrix.needsUpdate = heads.instanceMatrix.needsUpdate = true;
}

function drawBuses(dt, time) {
  stops.forEach((stop, i) => {
    const b = stop.bus, g = GEO[i];
    if (!b) return;
    if (!b.parked) {
      let left = DRIVE * dt;
      while (left > 0 && b.path.length) {
        const [tx, tz, jump] = b.path[0], m = b.mesh.position;
        if (jump) { m.set(tx, 0.1, tz); b.path.shift(); continue; }
        const dx = tx - m.x, dz = tz - m.z, d = Math.hypot(dx, dz);
        if (d > 0.001) b.face = Math.atan2(dx, dz);
        m.y = 0.1;
        if (d <= left) { m.x = tx; m.z = tz; left -= d; b.path.shift(); }
        else { m.x += dx / d * left; m.z += dz / d * left; left = 0; }
      }
      if (!b.path.length) { parkNow(i); b.squash = 1; }
    }
    const want = b.parked ? (g.dz ? Math.PI / 2 : 0) : b.face;
    let turn = (want - b.mesh.rotation.y) % Math.PI;
    if (turn > Math.PI / 2) turn -= Math.PI;
    if (turn < -Math.PI / 2) turn += Math.PI;
    b.mesh.rotation.y += turn * Math.min(1, dt * 14);
    b.size = Math.min(1, b.size + dt * 2.4);
    b.squash = Math.max(0, b.squash - dt * 7);
    const wob = Math.sin(time * 34) * b.squash * 0.05, fat = 1 + b.fill / b.seats * 0.08;
    b.mesh.scale.set(b.size * (fat + wob), b.size * fat * (1 - wob), b.size * (fat + wob));
  });
  for (let i = flying.length - 1; i >= 0; i--) {
    const f = flying[i];
    f.v += dt * 90;
    f.mesh.position.x += f.dx * f.v * dt;
    f.mesh.position.z += f.dz * f.v * dt;
    if (Math.abs(f.mesh.position.x) + Math.abs(f.mesh.position.z) > 60) { scene.remove(f.mesh); flying.splice(i, 1); }
  }
}
function drawLot(dt, time) {
  const canLeave = phase === 'playing' && stops.some((s) => !s.bus);
  depot.forEach((lane, l) => lane.forEach((b, j) => {
    const m = b.mesh.position, hop = j === 0 && canLeave ? Math.abs(Math.sin(time * 6)) * 0.35 : 0;
    m.z += (LOT_FRONT - j * LOT_PITCH - m.z) * Math.min(1, dt * 10);
    m.y = 0.1 + hop;
    const size = b.mesh.scale.x + ((j === 0 ? FRONT_SCALE : LOT_SCALE) - b.mesh.scale.x) * Math.min(1, dt * 10);
    b.mesh.scale.setScalar(size);
    b.label.classList.toggle('front', j === 0);
    place(b.label, m.x, 2 * size + hop, m.z);
  }));
}
function drawPops(dt) {
  const m = new THREE.Matrix4();
  popBits.forEach((b, i) => {
    if (b.life <= 0) return;
    b.life -= dt;
    b.vy -= dt * 20;
    b.x += b.vx * dt;
    b.y = Math.max(0.2, b.y + b.vy * dt);
    b.z += b.vz * dt;
    pops.setMatrixAt(i, b.life <= 0 ? m.makeScale(0, 0, 0) : m.makeTranslation(b.x, b.y, b.z));
  });
  pops.instanceMatrix.needsUpdate = true;
}
function updateLabels() {
  if (!labels.pills) return;
  stops.forEach((stop, i) => {
    const pill = labels.pills[i], b = stop.bus, g = GEO[i];
    pill.style.display = b && b.parked ? '' : 'none';
    if (b && b.parked) {
      pill.firstChild.textContent = `${b.fill}/${b.seats}`;
      const bar = pill.querySelector('i');
      bar.style.width = b.fill / b.seats * 100 + '%';
      bar.style.background = COLOURS[b.c].css;
      if (g.dz) place(pill, b.mesh.position.x - 3.1, 0.2, b.mesh.position.z);
      else place(pill, b.mesh.position.x, 0.2, b.mesh.position.z - 3.15);
    }
    const dot = labels.dots[i], from = phase === 'playing' ? [0, 1, 2].find((r) => lines[r][0] && routeOf(r) === i) : undefined;
    dot.style.display = from === undefined ? 'none' : '';
    if (from !== undefined) { dot.style.background = COLOURS[lines[from][0].c].css; place(dot, g.doorX, 0.4, g.doorZ); }
  });
  RIVERS.forEach((_, r) => {
    const box = labels.blocks[r], parts = [];
    lines[r].forEach((p) => {
      const last = parts[parts.length - 1];
      if (last && last.block === p.block) last.n++; else parts.push({ block: p.block, c: p.c, n: 1 });
    });
    const html = parts.map((b) => `<i style="background:${COLOURS[b.c].css}">${b.n}</i>`).join('');
    if (html !== lastBlocks[r]) { box.innerHTML = html; lastBlocks[r] = html; }
    box.style.display = html ? '' : 'none';
    if (r === 0) place(box, 7.6, 0.2, -9.3);
    else if (r === 1) place(box, -7.6, 0.2, -9.3);
    else place(box, 4.4, 0.2, 13.6);
  });
}

function update(dt) {
  const time = performance.now() / 1000;
  discs.forEach((d) => {
    d.vel += (d.k * Math.PI / 2 - d.spin) * 220 * dt - d.vel * 18 * dt;
    d.spin += d.vel * dt;
    d.spinner.rotation.y = -d.spin;
  });
  if (phase === 'countdown') {
    const before = Math.ceil(countdown);
    countdown -= dt;
    const shown = Math.ceil(countdown);
    if (countdown <= 0) {
      phase = 'playing';
      el('count3').textContent = 'Go!';
      tone(784, 0.3, 0.2);
      setTimeout(() => { if (el('count3').textContent === 'Go!') el('count3').textContent = ''; }, 500);
    } else if (shown !== before || el('count3').textContent === '') {
      el('count3').textContent = shown;
      tone(392, 0.16, 0.16);
    }
  }
  if (phase === 'playing') releaseFlow(dt);
  drawPeople(dt, time);
  drawBuses(dt, time);
  drawLot(dt, time);
  drawPops(dt);
  updateLabels();
  if (phase === 'playing' && isStuck()) finish(false);
  shake = Math.max(0, shake - dt * 1.6);
  camera.position.copy(camera.userData.base);
  camera.position.x += (Math.random() - 0.5) * shake;
  camera.position.z += (Math.random() - 0.5) * shake;
  camera.lookAt(camera.userData.look);
}

function resize() {
  const aspect = innerWidth / innerHeight, tan = Math.tan(THREE.MathUtils.degToRad(14));
  const distance = Math.max(21 / (2 * tan * aspect), 47 / (2 * tan));
  camera.userData.look = new THREE.Vector3(0, 0, -6.5);
  camera.userData.base = new THREE.Vector3(0, 0.95, 0.31).normalize().multiplyScalar(distance).add(camera.userData.look);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
function begin() {
  el('start').style.display = 'none';
  el('end').style.display = 'none';
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  phase = 'countdown';
  countdown = 3;
  reset();
}

const raycaster = new THREE.Raycaster(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
renderer.domElement.addEventListener('pointerdown', (e) => {
  raycaster.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: 1 - e.clientY / innerHeight * 2 }, camera);
  const point = raycaster.ray.intersectPlane(floorPlane, new THREE.Vector3());
  if (!point) return;
  for (let l = 0; l < 3; l++) {
    const front = depot[l][0];
    if (!front) continue;
    const p = front.mesh.position;
    if (Math.abs(point.x - p.x) < 1.8 && Math.abs(point.z - p.z) < 2) { if (phase === 'playing') callLane(l); return; }
    if (Math.abs(point.x - p.x) < 1.8 && point.z < p.z && depot[l].length > 1) { hint('Only the front bus can leave'); tone(90, 0.15, 0.2); return; }
  }
  discs.forEach((d, i) => { if (Math.hypot(point.x - d.x, point.z - d.z) < 4.6) twist(i); });
});
addEventListener('resize', resize);
el('play').onclick = begin;
el('again').onclick = begin;
el('restart').onclick = () => { if (phase === 'playing' || phase === 'countdown') begin(); };

resize();
phase = 'menu';
reset();
let last = performance.now();
function frame(now) {
  update(Math.min((now - last) / 1000, 0.05));
  last = now;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
